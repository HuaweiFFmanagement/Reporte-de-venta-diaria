<title>Cumplimiento · Field Force</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --red: #C7000B;
  --red-dark: #8F0009;
  --ink: #17181C;
  --ink-soft: #6B6C76;
  --surface: #F7F7F9;
  --surface-2: #F0F1F3;
  --border: #ECECEF;
  --white: #FFFFFF;
  --green: #157F49;
  --green-bg: #EAF6EF;
  --amber: #B8790A;
  --amber-bg: #FBF2E2;
  --red-bg: #FCEAEA;
  --shadow-sm: 0 1px 2px rgba(20,20,30,0.04);
  --shadow-md: 0 4px 16px rgba(20,20,30,0.05), 0 1px 3px rgba(20,20,30,0.04);
  --shadow-lg: 0 16px 40px rgba(20,20,30,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.num{font-family:'Poppins',system-ui,sans-serif;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface);position:relative;padding-bottom:48px;}

/* ---------- top bar ---------- */
.topbar{
  background:linear-gradient(150deg, var(--red) 0%, var(--red-dark) 100%);
  color:#fff; padding:26px 22px 34px; position:relative; overflow:hidden;
  border-radius:0 0 28px 28px;
}
.topbar::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,0.07);}
.topbar::before{content:"";position:absolute;right:10px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.05);}
.topbar .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;opacity:0.8;font-weight:600;position:relative;}
.topbar h1{font-size:21px;margin:5px 0 0;font-weight:700;letter-spacing:-0.2px;position:relative;}
.backbtn{background:rgba(255,255,255,0.16);border:none;color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;cursor:pointer;position:relative;}
.backbtn:active{background:rgba(255,255,255,0.28);}

/* ---------- generic ---------- */
.section{padding:22px 20px;}
.card{background:var(--white);border:none;box-shadow:var(--shadow-md);border-radius:20px;padding:20px;margin-bottom:16px;}
.label-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:700;margin-bottom:10px;}
input,select,button{font-family:inherit;font-size:15px;}
input,select{
  width:100%;padding:14px 15px;border-radius:14px;border:none;
  background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px transparent;
  transition:box-shadow .15s;
}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--red);background:var(--white);}
button.primary{
  width:100%;background:var(--red);color:#fff;border:none;border-radius:14px;
  padding:15px;font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s, box-shadow .15s;
  box-shadow:0 6px 16px rgba(199,0,11,0.25);
}
button.primary:active{transform:scale(0.98);background:var(--red-dark);}
button.ghost{
  background:var(--surface-2);border:none;color:var(--ink);border-radius:14px;
  padding:11px 16px;font-weight:600;cursor:pointer;font-size:13px;
}

/* ---------- combobox / autocomplete ---------- */
.combo-wrap{padding:20px 20px 8px;position:relative;}
.combo-label{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;display:block;}
.combo-input-wrap{position:relative;}
.combo-input-wrap input{padding-right:36px;}
.combo-caret{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;font-size:12px;}
.combo-list{
  position:absolute;left:20px;right:20px;top:100%;margin-top:8px;
  background:var(--white);border:none;border-radius:18px;
  max-height:320px;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:40;
  display:none;
}
.combo-list.open{display:block;}
.combo-opt{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
.combo-opt:last-child{border-bottom:none;}
.combo-opt:hover, .combo-opt.hi{background:var(--surface);}
.combo-opt .n{font-weight:600;font-size:14px;}
.combo-opt .n mark{background:#FCEAEA;color:var(--red);border-radius:3px;padding:0 1px;}
.combo-opt .s{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.combo-empty{padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;}

/* ---------- quota card ---------- */
.quota-card{background:linear-gradient(150deg, var(--ink) 0%, #2B2C33 100%);box-shadow:var(--shadow-md);color:#fff;}
.quota-main-row{display:flex;align-items:center;gap:18px;margin-top:8px;}
.quota-big{font-family:'Poppins';font-weight:800;font-size:31px;line-height:1;}
.quota-tag{font-size:11px;color:rgba(255,255,255,0.6);margin-top:5px;}
.quota-div{width:1px;align-self:stretch;background:rgba(255,255,255,0.12);}
.quota-cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.quota-cat-chip{background:rgba(255,255,255,0.08);border-radius:12px;padding:8px 12px;font-size:11.5px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:70px;}
.quota-cat-chip span{color:rgba(255,255,255,0.6);}
.quota-cat-chip b{font-family:'Poppins';font-size:15px;}

/* ---------- gauges ---------- */
.gauge-row{display:flex;justify-content:center;gap:30px;padding:8px 0 4px;}
.gauge-col{display:flex;flex-direction:column;align-items:center;}
.gauge-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-top:8px;}
.gauge-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;text-align:center;}
.status-pill{
  display:inline-block;padding:6px 15px;border-radius:20px;font-size:12.5px;font-weight:700;margin-top:16px;
}
.pill-green{background:var(--green-bg);color:var(--green);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.pill-red{background:var(--red-bg);color:var(--red);}

.stat-row{display:flex;gap:10px;margin-top:16px;}
.stat{flex:1;background:var(--surface-2);border-radius:14px;padding:12px 12px;text-align:center;}
.stat .v{font-size:18px;font-weight:800;font-family:'Poppins';}
.stat .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-top:3px;}

/* ---------- daily form (por categoria) ---------- */
.fieldlabel{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
.cat-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.cat-input-item{background:var(--surface-2);border-radius:14px;padding:11px 13px;}
.cat-input-item label{font-size:12px;font-weight:700;margin-bottom:7px;display:block;}
.cat-input-item input{background:var(--white);padding:10px 12px;}
.day-total-line{display:flex;justify-content:space-between;padding:14px 2px 0;font-size:13px;font-weight:700;color:var(--ink-soft);}
.day-total-line b{color:var(--ink);font-family:'Poppins';}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;z-index:50;
  max-width:80%;text-align:center;
}
.toast.show{opacity:1;bottom:34px;}

/* ---------- category bars ---------- */
.cat-toggle{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.cat-toggle .filter-chip{margin:0;}
.cat-row{margin-bottom:14px;}
.cat-row:last-child{margin-bottom:0;}
.cat-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.cat-head .cn{font-weight:700;}
.cat-head .cv{color:var(--ink-soft);}
.cat-bar-bg{background:var(--surface-2);border-radius:8px;height:9px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:8px;}

/* ---------- week cards ---------- */
.week-card{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;}
.week-card:not(:last-child){border-bottom:1px solid var(--border);}
.week-card.current{background:var(--red-bg);border-radius:14px;padding:14px 14px;border-bottom:none;margin-bottom:6px;}
.week-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;}
.week-range{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.week-nums{text-align:right;font-size:13px;}
.week-nums b{font-family:'Poppins';}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;margin-left:8px;}

/* history */
.hist-row{padding:11px 4px;}
.hist-row:not(:last-child){border-bottom:1px solid var(--border);}
.hist-top{display:flex;justify-content:space-between;font-size:13px;}
.hist-date{color:var(--ink-soft);}
.hist-units{font-weight:700;}
.hist-breakdown{font-size:11px;color:var(--ink-soft);margin-top:3px;}

/* admin table */
.admin-row{display:flex;align-items:center;gap:10px;padding:14px 6px;border-radius:14px;transition:background .1s;}
.admin-row:not(:last-child){border-bottom:1px solid var(--border);}
.admin-row .an{flex:1;min-width:0;}
.admin-row .an .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-row .an .s{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.admin-row .ap{width:74px;text-align:right;font-weight:800;font-family:'Poppins';font-size:14px;}
.filter-chip{
  display:inline-block;padding:7px 14px;border-radius:20px;border:none;
  font-size:12.5px;font-weight:600;margin-right:0;margin-bottom:0;cursor:pointer;color:var(--ink-soft);
  background:var(--surface-2);
}
.filter-chip.active{background:var(--ink);color:#fff;}
.admin-summary-band{display:flex;gap:10px;padding:16px 20px 4px;}
.linkbtn{background:none;border:none;color:var(--red);font-weight:700;font-size:13px;cursor:pointer;padding:0;}
.day-grid{display:flex;flex-wrap:wrap;gap:7px;}
.day-box{width:15.6%;aspect-ratio:1;min-width:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.day-loaded{background:var(--green-bg);color:var(--green);}
.day-missing{background:var(--red-bg);color:var(--red);}
.day-future{background:var(--surface-2);color:var(--ink-soft);font-weight:500;}
.day-legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--ink-soft);}
.day-legend span{display:inline-flex;align-items:center;gap:6px;}
.day-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.admin-row-click{cursor:pointer;}
.admin-row-click:active{background:var(--surface-2);}
.cat-mini{font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
.cat-mini b{font-weight:700;}
.ap .chev{color:var(--ink-soft);font-size:13px;margin-left:2px;}
.footer-note{font-size:11px;color:var(--ink-soft);text-align:center;padding:16px 30px 0;line-height:1.6;}
.empty-msg{text-align:center;color:var(--ink-soft);padding:24px 10px;font-size:13px;}
.announcement-card{background:var(--amber-bg);box-shadow:none;color:#7a5406;font-size:13px;line-height:1.5;font-weight:600;}

/* ---------- lobby (Huawei Retail System) ---------- */
.lobby-header{padding:40px 24px 6px;text-align:center;}
.lobby-logo{color:var(--red);font-weight:800;font-size:19px;letter-spacing:4px;font-family:'Poppins';}
.lobby-title{font-family:'Poppins';font-weight:800;font-size:25px;margin-top:16px;color:var(--ink);letter-spacing:-0.3px;line-height:1.2;}
.lobby-sub{font-size:13px;color:var(--ink-soft);margin-top:8px;}
.lobby-card{background:var(--white);box-shadow:var(--shadow-md);border-radius:20px;padding:24px 20px;margin-bottom:14px;text-align:center;cursor:pointer;transition:transform .1s;color:var(--ink);}
.lobby-card:active{transform:scale(0.98);}
.lobby-card-title{font-family:'Poppins';font-weight:700;font-size:16px;}
.lobby-card-sub{font-size:12px;color:var(--ink-soft);margin-top:6px;}
</style>

/* Roles de promotor por tienda. La mayoría de tiendas tiene 1 solo promotor
   (rol implícito 'P1', sin pedir selección). Las que tienen más de 1
   (s.promoters > 1) piden elegir "Promotor 1/2/3...". Las que además tienen
   un promotor exclusivo de Tablets (s.tabletSpecialist) suman un rol "TAB"
   que solo reporta esa categoría, y el resto de roles de esa tienda dejan
   de reportar Tablets (esa cuota es 100% del especialista). */
function storeRoles(store){
  const roles = [];
  const n = Math.max(1, store.promoters || 1);
  for(let i=1;i<=n;i++) roles.push({ key: 'P'+i, label: 'Promotor '+i, cats: (store.tabletSpecialist ? CAT_ORDER.filter(c=>c!=='Tab') : CAT_ORDER) });
  if(store.tabletSpecialist) roles.push({ key: 'TAB', label: 'Promotor Tablets', cats: ['Tab'] });
  return roles;
}

function numOr0(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function fmt(n){ n = numOr0(n); return Math.round(n).toLocaleString('es-CO'); }
function pad(n){ return n.toString().padStart(2,'0'); }
/* normaliza claves de fecha: acepta 'yyyy-MM-dd' o el formato Date.toString() de JS
   (por si alguna fila del Sheet quedó guardada como fecha real en vez de texto) */
function normalizeIsoKey(key){
  if(/^\d{4}-\d{2}-\d{2}$/.test(key)) return key;
  const d = new Date(key);
  if(!isNaN(d.getTime())){
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  return key;
}
function normalizedEntries(salesMap){
  return Object.entries(salesMap||{}).map(([iso,e])=>[normalizeIsoKey(iso), e]);
}
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);

}

function normalize(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlightMatch(text, term){
  if(!term) return escapeHtml(text);
  const nText = normalize(text);
  const nTerm = normalize(term);
  const idx = nText.indexOf(nTerm);
  if(idx===-1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+term.length)) + '</mark>' + escapeHtml(text.slice(idx+term.length));
}
/* Un día guardado puede venir en 3 formas (por compatibilidad con datos viejos):
   - número suelto (formato inicial)                         -> 1 solo promotor
   - {SP:n, Tab:n, WR:n, AUD:n} (formato sin roles)           -> 1 solo promotor
   - {P1:{SP:n,...}, P2:{...}, TAB:{...}} (formato con roles) -> multi-promotor
   dayPromoterEntries() siempre devuelve [ [rolKey, {SP,Tab,WR,AUD}], ... ] */
function isRoleMap(obj){
  const keys = Object.keys(obj);
  return keys.length>0 && keys.every(k=>/^(P\d+|TAB)$/.test(k));
}
function dayPromoterEntries(entry){
  if(!entry) return [];
  if(typeof entry === 'number') return [['P1', {SP:entry,Tab:0,WR:0,AUD:0}]];
  if(isRoleMap(entry)) return Object.entries(entry);
  return [['P1', entry]];
}
function dayTotal(entry){
  return dayPromoterEntries(entry).reduce((a,[,cats])=> a + CAT_ORDER.reduce((s,c)=>s+numOr0(cats[c]),0), 0);
}
function dayCat(entry, cat){
  return dayPromoterEntries(entry).reduce((a,[,cats])=> a + numOr0(cats[cat]), 0);
}
function dayRole(entry, roleKey){
  const found = dayPromoterEntries(entry).find(([k])=>k===roleKey);
  const c = found ? found[1] : {SP:0,Tab:0,WR:0,AUD:0};
  return {SP:numOr0(c.SP), Tab:numOr0(c.Tab), WR:numOr0(c.WR), AUD:numOr0(c.AUD)};
}


/* Semanas del mes en formato Lunes-Domingo real (como se miden en el negocio).
   Se calculan los lunes del mes; el primer bloque arranca el día 1 y cierra
   el domingo de la primera semana completa, cada bloque intermedio es una
   semana Lun-Dom completa, y el último bloque absorbe cualquier día sobrante
   de fin de mes. El número de bloques se ajusta a WEEK_WEIGHTS.length para
   que siga alineado con el desglose semanal (W1..W4) de tu archivo de target. */
function buildWeeks(){
  const N = WEEK_WEIGHTS.length;
  const mondays = [];
  for(let d=1; d<=DAYS_IN_MONTH; d++){
    if(new Date(TARGET_YEAR, TARGET_MONTH, d).getDay()===1) mondays.push(d);
  }
  const bounds = [];
  let cursor = 1;
  for(let i=0; i<mondays.length; i++){
    if(bounds.length === N-1){
      bounds.push([cursor, DAYS_IN_MONTH]);
      cursor = DAYS_IN_MONTH+1;
      break;
    }
    const end = Math.min(mondays[i]+6, DAYS_IN_MONTH);
    bounds.push([cursor, end]);
    cursor = end+1;
  }
  if(cursor <= DAYS_IN_MONTH) bounds.push([cursor, DAYS_IN_MONTH]);
  while(bounds.length > N){ const last = bounds.pop(); bounds[bounds.length-1][1] = last[1]; }
  while(bounds.length < N){ bounds.push([DAYS_IN_MONTH, DAYS_IN_MONTH]); } // resguardo, no debería pasar en un mes normal
  return bounds.map((b,i)=>({
    num: i+1,
    start: new Date(TARGET_YEAR, TARGET_MONTH, b[0]),
    end: new Date(TARGET_YEAR, TARGET_MONTH, b[1]),
    weight: WEEK_WEIGHTS[i]
  }));
}
const WEEKS = buildWeeks();

function weekOfDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  for(const w of WEEKS){ if(dt >= w.start && dt <= w.end) return w.num; }
  return null;
}
function currentWeekNum(){
  const now = new Date();
  if(now.getFullYear()===TARGET_YEAR && now.getMonth()===TARGET_MONTH){
    return weekOfDate(todayISO()) || WEEKS[WEEKS.length-1].num;
  }
  return WEEKS[WEEKS.length-1].num;
}

/* ============ storage (Google Sheets vía Apps Script, JSONP) ============
   Usamos una etiqueta <script> en vez de fetch() para evitar por completo
   los problemas de CORS al conectar con Apps Script.                     */
function jsonpRequest(params, timeoutMs, apiUrl){
  return new Promise((resolve, reject)=>{
    const cbName = '__jsonp_cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timeoutId;
    function cleanup(){
      clearTimeout(timeoutId);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    const qs = new URLSearchParams({...params, callback: cbName}).toString();
    script.src = `${apiUrl || API_URL}?${qs}`;
    script.onerror = ()=>{ cleanup(); reject(new Error('jsonp load error')); };
    timeoutId = setTimeout(()=>{ cleanup(); reject(new Error('jsonp timeout')); }, timeoutMs || 20000);
    document.body.appendChild(script);
  });
}
/* Reintenta una vez en silencio antes de rendirse — Apps Script a veces responde
   lento cuando varios promotores cargan venta al mismo tiempo. */
async function jsonpRequestRetry(params, timeoutMs, apiUrl){
  try{ return await jsonpRequest(params, timeoutMs, apiUrl); }
  catch(e){ return await jsonpRequest(params, timeoutMs, apiUrl); }
}

/* ---------- DASHBOARD ---------- */
function ringSvg(pct, size, strokeW, color, fontSize){
  const r = (size/2) - strokeW;
  const circ = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct));
  const dash = (clamped/100)*circ;
  const c = size/2;
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeW}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c+fontSize*0.35}" text-anchor="middle" style="font-family:Poppins;font-weight:800;font-size:${fontSize}px;fill:var(--ink);">${Math.round(pct)}%</text>
  </svg>`;
}

function catRowsHtml(soldByCat, targetByCat){
  return CAT_ORDER.map(c=>{
    const sold = soldByCat[c]||0;
    const tgt = Math.max(0, targetByCat[c]||0);
    const pct = tgt>0 ? Math.min(100, sold/tgt*100) : (sold>0?100:0);
    return `<div class="cat-row">
      <div class="cat-head"><span class="cn">${CAT_LABEL[c]}</span><span class="cv">${fmt(sold)} / ${fmt(tgt)} · ${tgt>0?Math.round(sold/tgt*100):0}%</span></div>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${CAT_COLOR[c]};"></div></div>
    </div>`;
  }).join('');
}

async function renderDashboard(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="section" style="text-align:center;color:#888;padding-top:60px;">Cargando datos...</div>`;
  const all = await loadAllSales();
  const salesMap = all[currentStore.code] || {};
  const entries = normalizedEntries(salesMap).filter(([iso])=> iso.startsWith(`${TARGET_YEAR}-${pad(TARGET_MONTH+1)}`));
  const totalSold = entries.reduce((a,[,e])=>a+dayTotal(e),0);
  const target = currentStore.target;
  const pctMonth = target>0 ? (totalSold/target*100) : 0;

  const roles = storeRoles(currentStore);
  if(!selectedRoleKey || !roles.find(r=>r.key===selectedRoleKey)) selectedRoleKey = roles[0].key;
  const activeRole = roles.find(r=>r.key===selectedRoleKey);

  // -------- semana actual --------
  const wNum = currentWeekNum();
  const weekTarget = Math.max(0, currentStore.w ? currentStore.w[wNum-1] : (target/WEEKS.length));
  let weekSold = 0;
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) weekSold += dayTotal(e); });
  const pctWeek = weekTarget>0 ? (weekSold/weekTarget*100) : 0;

  // -------- proyección: según días efectivamente cargados y días hábiles restantes --------
  const daysWorked = entries.length;
  const dailyAvg = daysWorked>0 ? totalSold/daysWorked : 0;
  const daysRemaining = Math.max(0, WORKING_DAYS_PER_MONTH - daysWorked);
  const projected = totalSold + dailyAvg*daysRemaining;
  const projectedPct = target>0 ? (projected/target*100) : 0;
  const st = statusFor(projectedPct);

  // -------- categorías (mes o semana según toggle) --------
  const soldByCatMonth = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([,e])=>{ CAT_ORDER.forEach(c=> soldByCatMonth[c]+=dayCat(e,c)); });
  const soldByCatWeek = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) CAT_ORDER.forEach(c=> soldByCatWeek[c]+=dayCat(e,c)); });
  const targetByCatMonth = currentStore.cat_target || {SP:0,Tab:0,WR:0,AUD:0};
  const targetByCatWeek = {};
  CAT_ORDER.forEach(c=> targetByCatWeek[c] = currentStore.cat_w && currentStore.cat_w[c] ? currentStore.cat_w[c][wNum-1] : 0);

  // -------- todas las semanas --------
  const now = new Date();
  const isCurrentMonth = now.getFullYear()===TARGET_YEAR && now.getMonth()===TARGET_MONTH;
  let weekHtml = '';
  WEEKS.forEach(w=>{
    const wt = Math.max(0, currentStore.w ? currentStore.w[w.num-1] : (target/WEEKS.length));
    let wSold = 0;
    entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===w.num) wSold += dayTotal(e); });
    const wPct = wt>0 ? (wSold/wt*100) : 0;
    const isPast = isCurrentMonth ? (w.end < now && w.num !== wNum) : true;
    const isCurrent = isCurrentMonth && w.num===wNum;
    let badge;
    if(isCurrent) badge = `<span class="badge pill-amber">En curso</span>`;
    else if(isPast) badge = wPct>=100 ? `<span class="badge pill-green">Cumplió</span>` : `<span class="badge pill-red">No cumplió</span>`;
    else badge = `<span class="badge" style="background:var(--surface);color:var(--ink-soft);">Próxima</span>`;
    weekHtml += `<div class="week-card ${isCurrent?'current':''}">
      <div><div class="week-name">Semana ${w.num}${badge}</div>
        <div class="week-range">${w.start.toLocaleDateString('es-CO',{day:'numeric',month:'short'})} – ${w.end.toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</div></div>
      <div class="week-nums"><b>${fmt(wSold)}</b> / ${fmt(wt)}<br><span style="color:var(--ink-soft)">${Math.round(wPct)}%</span></div>
    </div>`;
  });

  const sortedEntries = [...entries].sort((a,b)=> a[0]<b[0]?1:-1);
  let histHtml = sortedEntries.slice(0,10).map(([iso,e])=>{
    const parts = CAT_ORDER.filter(c=>dayCat(e,c)>0).map(c=>`${CAT_LABEL[c]} ${dayCat(e,c)}`).join(' · ');
    return `<div class="hist-row">
      <div class="hist-top"><span class="hist-date">${dateLabel(iso)}</span><span class="hist-units">${fmt(dayTotal(e))} u.</span></div>
      ${parts? `<div class="hist-breakdown">${parts}</div>` : ''}
    </div>`;
  }).join('') || `<div class="hist-row" style="color:var(--ink-soft);text-align:center;">Aún no hay registros este mes.</div>`;

  app.innerHTML = `
  <div class="topbar">
    <button class="backbtn" id="backBtn">‹ Cambiar tienda</button>
    <div class="eyebrow">${currentStore.account || currentStore.channel} · ${currentStore.code}</div>
    <h1>${currentStore.store}</h1>
  </div>

  <div class="section" style="padding-top:22px;">
    <div class="card quota-card">
      <div class="label-eyebrow" style="color:rgba(255,255,255,0.75);">Tu cuota · ${TARGET_MONTH_LABEL}</div>
      <div class="quota-main-row">
        <div><div class="quota-big">${fmt(target)}</div><div class="quota-tag">unidades este mes</div></div>
        <div class="quota-div"></div>
        <div><div class="quota-big">${fmt(weekTarget)}</div><div class="quota-tag">Semana ${wNum} (actual)</div></div>
      </div>
      <div class="quota-cats">
        ${CAT_ORDER.map(c=>`<div class="quota-cat-chip"><span>${CAT_LABEL[c]}</span><b>${fmt(Math.max(0,(currentStore.cat_target&&currentStore.cat_target[c])||0))}</b></div>`).join('')}
      </div>
    </div>

    <div class="card">

          <div class="gauge-tag">Mes</div>
          <div class="gauge-sub">${fmt(totalSold)} / ${fmt(target)} u.</div>
        </div>
        <div class="gauge-col">
          ${ringSvg(pctWeek, 148, 13, pctWeek>=100?'var(--green)':'var(--red)', 26)}
          <div class="gauge-tag">Semana ${wNum}</div>
          <div class="gauge-sub">${fmt(weekSold)} / ${fmt(weekTarget)} u.</div>
        </div>
      </div>
      <div style="text-align:center;">

      </div>
      <div class="stat-row">

        <div class="stat"><div class="v">${fmt(projected)}</div><div class="l">Proy. cierre mes</div></div>
      </div>

    <div class="card">

    if(!iso){ showToast('Elige una fecha'); return; }

    let total = 0;
    let invalid = false;
    document.querySelectorAll('.catInput').forEach(inp=>{
      const v = inp.value===''? 0 : Number(inp.value);
      if(isNaN(v) || v<0) invalid = true;
      catAmounts[inp.dataset.cat] = v;
      total += v;
    });
    if(invalid){ showToast('Ingresa números válidos'); return; }
    if(total===0){ showToast('Ingresa al menos una unidad en alguna categoría'); return; }
    const btn = document.getElementById('saveBtn');
    btn.textContent = 'Guardando...'; btn.disabled = true;
    const ok = await saveEntry(currentStore.code, iso, selectedRoleKey, catAmounts);
    if(ok){ showToast('Venta guardada ✓'); renderDashboard(); }
    else { showToast('No se pudo guardar, intenta de nuevo'); btn.textContent='Guardar venta del día'; btn.disabled=false; }
  });

  document.querySelectorAll('#catViewToggle .filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ catViewMode = chip.dataset.mode; renderDashboard(); });
  });
}

/* ---------- ADMIN SUMMARY ---------- */
function computeStoreStats(s, all, wNum){
  const salesMap = all[s.code] || {};
  const entries = normalizedEntries(salesMap).filter(([iso])=> iso.startsWith(`${TARGET_YEAR}-${pad(TARGET_MONTH+1)}`));
  const totalSold = entries.reduce((a,[,e])=>a+dayTotal(e),0);
  const pctMonth = s.target>0 ? (totalSold/s.target*100) : 0;
  const daysWorked = entries.length;
  const dailyAvg = daysWorked>0 ? totalSold/daysWorked : 0;
  const daysRemaining = Math.max(0, WORKING_DAYS_PER_MONTH - daysWorked);
  const projectedPct = s.target>0 ? ((totalSold + dailyAvg*daysRemaining)/s.target*100) : 0;

  const weekTarget = Math.max(0, s.w ? s.w[wNum-1] : (s.target/WEEKS.length));
  let weekSold = 0;
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) weekSold += dayTotal(e); });
  const pctWeek = weekTarget>0 ? (weekSold/weekTarget*100) : 0;

  const soldByCatMonth = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([,e])=> CAT_ORDER.forEach(c=> soldByCatMonth[c]+=dayCat(e,c)));
  const soldByCatWeek = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) CAT_ORDER.forEach(c=> soldByCatWeek[c]+=dayCat(e,c)); });
  const targetByCatMonth = s.cat_target || {SP:0,Tab:0,WR:0,AUD:0};
  const targetByCatWeek = {};
  CAT_ORDER.forEach(c=> targetByCatWeek[c] = Math.max(0, s.cat_w && s.cat_w[c] ? s.cat_w[c][wNum-1] : 0));

  const roles = storeRoles(s);

  return {...s, totalSold, pctMonth, projectedPct, weekTarget, weekSold, pctWeek,
    soldByCatMonth, soldByCatWeek, targetByCatMonth, targetByCatWeek, roles, salesMap, entries};
}

function roleTotalForStat(stat, roleKey, mode, wNum){
  const ents = mode==='week' ? stat.entries.filter(([iso])=>weekOfDate(iso)===wNum) : stat.entries;
  return ents.reduce((a,[,e])=>{
    const r = dayRole(e, roleKey);
    return a + CAT_ORDER.reduce((s,c)=>s+Number(r[c]||0),0);
  }, 0);
}

/* multi-select genérico: alterna un valor dentro de un Set (o null = "todos") */
function toggleMulti(current, value){
  const s = current===null ? new Set() : new Set(current);
  if(s.has(value)) s.delete(value); else s.add(value);
  return s.size ? s : null;
}

function renderTabPorSupervisor(byChannel, wNum, chipsHtml){
  if(!adminLoadDate) adminLoadDate = todayISO();
  const isWeek = adminViewMode==='week';
  const soldKey = isWeek ? 'weekSold' : 'totalSold';
  const targetKey = isWeek ? 'weekTarget' : 'target';

  const bySup = {};
  byChannel.forEach(r=>{
    const key = r.supervisor || 'Sin supervisor';
    if(!bySup[key]) bySup[key] = { count:0, sold:0, target:0, loadedToday:0, zeroCount:0, zeroStores:[] };
    const g = bySup[key];
    g.count++;
    g.sold += numOr0(r[soldKey]);
    g.target += numOr0(r[targetKey]);
    if(numOr0(r[soldKey])===0){ g.zeroCount++; g.zeroStores.push({code:r.code, store:r.store}); }
    const norm = normalizedEntries(r.salesMap);
    const found = norm.find(([iso])=>iso===adminLoadDate);
    const dayEntry = found ? found[1] : null;
    const loadedRoles = dayEntry ? dayPromoterEntries(dayEntry).filter(([,cats])=> CAT_ORDER.some(c=>Number(cats[c])>0)).map(([k])=>k) : [];
    if(loadedRoles.length >= r.roles.length) g.loadedToday++;
  });

  const allRows = Object.entries(bySup).map(([name,g])=>({
    name, count:g.count, sold:g.sold, target:g.target,
    pct: g.target>0 ? Math.round(g.sold/g.target*100) : 0,
    loadedToday:g.loadedToday, zeroCount:g.zeroCount, zeroStores:g.zeroStores
  })).sort((a,b)=> a.pct-b.pct);

  const withZero = allRows.filter(r=>r.zeroCount>0).length;
  const withIncomplete = allRows.filter(r=>r.loadedToday<r.count).length;

  const rows = supFilter===null ? allRows : allRows.filter(r=>{
    return (supFilter.has('zero') && r.zeroCount>0) || (supFilter.has('incomplete') && r.loadedToday<r.count);
  });

  const rowsHtml = rows.map(r=>{
    const color = r.pct>=100 ? 'var(--green)' : (r.pct>=85 ? 'var(--ink)' : 'var(--red)');
    const isOpen = expandedSupNames.has(r.name);
    const zeroListHtml = (isOpen && r.zeroCount>0) ? `
      <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);">
        ${r.zeroStores.map(s=>`<div class="admin-row-click" data-code="${s.code}" style="padding:6px 4px;font-size:12.5px;color:var(--red);cursor:pointer;">${escapeHtml(s.store)} <span class="chev">›</span></div>`).join('')}
      </div>` : '';
    return `<div class="admin-row sup-row-click" data-sup="${escapeHtml(r.name)}" style="align-items:flex-start;flex-direction:column;cursor:pointer;">
      <div style="display:flex;width:100%;align-items:flex-start;">
        <div class="an">
          <div class="n">${escapeHtml(r.name)}</div>
          <div class="s">${r.count} tienda${r.count!==1?'s':''} · ${fmt(r.sold)}/${fmt(r.target)} u.</div>
          <div class="cat-mini">
            Cargaron hoy <b style="color:${r.loadedToday>=r.count?'var(--green)':'var(--amber)'}">${r.loadedToday}/${r.count}</b>
            &nbsp;·&nbsp; 0 ventas <b style="color:${r.zeroCount>0?'var(--red)':'var(--green)'}">${r.zeroCount}</b>
            ${r.zeroCount>0 ? `<span class="chev">${isOpen?'▾':'›'}</span>` : ''}
          </div>
        </div>
        <div class="ap" style="color:${color}">${r.pct}%</div>
      </div>
      ${zeroListHtml}
    </div>`;
  }).join('');

  return `
  <div class="section" style="padding-top:10px;padding-bottom:0;">
    <div class="cat-toggle" id="modeToggle">
      <span class="filter-chip ${adminViewMode==='month'?'active':''}" data-mode="month">General (mes)</span>
      <span class="filter-chip ${adminViewMode==='week'?'active':''}" data-mode="week">Semana ${wNum}</span>

    <input type="date" id="supLoadDateInput" value="${adminLoadDate}" min="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-01" max="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-${pad(DAYS_IN_MONTH)}"/>

  <div class="admin-summary-band">
    <div class="stat sup-stat-click" data-val="incomplete" style="flex:1;background:var(--amber-bg);cursor:pointer;${supFilter&&supFilter.has('incomplete')?'outline:2px solid var(--amber);':''}"><div class="v" style="color:var(--amber)">${withIncomplete}</div><div class="l">Con carga incompleta hoy</div></div>
    <div class="stat sup-stat-click" data-val="zero" style="flex:1;background:var(--red-bg);cursor:pointer;${supFilter&&supFilter.has('zero')?'outline:2px solid var(--red);':''}"><div class="v" style="color:var(--red)">${withZero}</div><div class="l">Con alguna tienda en 0</div></div>
  </div>
  <div class="section" style="padding-top:6px;">

function downloadPorSupervisorXlsx(byChannel, mode, dateIso){
  const isWeek = mode==='week';
  const soldKey = isWeek ? 'weekSold' : 'totalSold';
  const targetKey = isWeek ? 'weekTarget' : 'target';
  const bySup = {};
  byChannel.forEach(r=>{
    const key = r.supervisor || 'Sin supervisor';
    if(!bySup[key]) bySup[key] = { count:0, sold:0, target:0, loadedToday:0, zeroCount:0 };
    const g = bySup[key];
    g.count++;
    g.sold += numOr0(r[soldKey]);
    g.target += numOr0(r[targetKey]);
    if(numOr0(r[soldKey])===0) g.zeroCount++;
    const norm = normalizedEntries(r.salesMap);
    const found = norm.find(([iso])=>iso===dateIso);
    const dayEntry = found ? found[1] : null;
    const loadedRoles = dayEntry ? dayPromoterEntries(dayEntry).filter(([,cats])=> CAT_ORDER.some(c=>Number(cats[c])>0)).map(([k])=>k) : [];
    if(loadedRoles.length >= r.roles.length) g.loadedToday++;
  });
  const aoa = [['Supervisor','Tiendas','Vendido','Target','% Cumplimiento','Cargaron hoy','Tiendas en 0']];
  Object.entries(bySup).sort((a,b)=> a[0].localeCompare(b[0],'es')).forEach(([name,g])=>{
    const pct = g.target>0 ? Math.round(g.sold/g.target*100) : 0;
    aoa.push([name, g.count, g.sold, g.target, pct+'%', `${g.loadedToday}/${g.count}`, g.zeroCount]);
  });
  exportExcel(`cumplimiento_por_supervisor_${mode}_${todayISO()}.xlsx`, [{name:'Por supervisor', aoa}]);
}

  if(bulkParsedAgg) renderBulkPreview(); // conserva la vista previa si ya se había leído un archivo

    let t=0;
    document.querySelectorAll('.cvCatInput').forEach(inp=> t+=Number(inp.value)||0);
    const el = document.getElementById('cvDayTotalPreview');
    if(el) el.textContent = fmt(t);
  }
  document.querySelectorAll('.cvCatInput').forEach(inp=> inp.addEventListener('input', recalcCvPreview));

  const dateInp = document.getElementById('cvDateInput');
  if(dateInp){
    dateInp.addEventListener('change', (e)=>{
      const iso = e.target.value;
      const store = STORES.find(s=>s.code===cargarVentaStoreCode);
      const salesMap = (cargarVentaAllCache && store && cargarVentaAllCache[store.code]) || {};
      const found = normalizedEntries(salesMap).find(([k])=>k===iso);
      const existing = found ? found[1] : null;
      const roleCats = dayRole(existing, cargarVentaRole);
      document.querySelectorAll('.cvCatInput').forEach(inp=>{
        const c = inp.dataset.cat;
        inp.value = existing ? (roleCats[c]||'') : '';
      });
      recalcCvPreview();
    });
  }

  const saveBtn = document.getElementById('cvSaveBtn');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const iso = document.getElementById('cvDateInput').value;
      if(!iso){ showToast('Elige una fecha'); return; }
      const catAmounts = {SP:0,Tab:0,WR:0,AUD:0};
      let total=0, invalid=false;
      document.querySelectorAll('.cvCatInput').forEach(inp=>{
        const v = inp.value===''?0:Number(inp.value);
        if(isNaN(v)||v<0) invalid=true;
        catAmounts[inp.dataset.cat]=v; total+=v;
      });
      if(invalid){ showToast('Ingresa números válidos'); return; }
      if(total===0){ showToast('Ingresa al menos una unidad'); return; }
      saveBtn.textContent='Guardando...'; saveBtn.disabled=true;
      const store = STORES.find(s=>s.code===cargarVentaStoreCode);
      const ok = await saveEntry(cargarVentaStoreCode, iso, cargarVentaRole, catAmounts);
      if(ok){
        showToast('Venta oficial guardada ✓');
        cargarVentaLog.unshift({store: store.store, date: iso, total});
        renderAdmin();
      } else {
        showToast('No se pudo guardar, intenta de nuevo');
        saveBtn.textContent='Guardar venta oficial'; saveBtn.disabled=false;
      }
    });
  }
}

/* ---------- carga masiva desde el Excel de venta oficial (Diario_x_Categoria) ---------- */
const BULK_CAT_MAP = {Smartphones:'SP', Tab:'Tab', Wearables:'WR', Earphones:'AUD'};

async function handleBulkFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('bulkPreview');
  if(preview) preview.innerHTML = `<div class="footer-note">Leyendo archivo...</div>`;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheetName = wb.SheetNames.find(n=> n.toLowerCase().replace(/\s/g,'').includes('diario_x_categoria'))
      || wb.SheetNames.find(n=> n.toLowerCase().includes('diario'));
    if(!sheetName){
      if(preview) preview.innerHTML = `<div class="footer-note" style="color:var(--red);">No encontré una pestaña "Diario_x_Categoria" en este archivo.</div>`;
      return;
    }
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true});
    const headerRowIdx = rows.findIndex(r=> r && r[0]==='Canal');
    if(headerRowIdx===-1){
      if(preview) preview.innerHTML = `<div class="footer-note" style="color:var(--red);">No reconocí el formato de encabezados de esta hoja.</div>`;
      return;
    }
    const header = rows[headerRowIdx];
    const dayCols = [];
    for(let c=3; c<header.length; c++){
      const h = String(header[c]||'');
      const m = h.match(/^(\d{1,2})-/);
      if(m) dayCols.push({col:c, day: Number(m[1])});
    }
    const storeByNorm = {};
    STORES.forEach(s=> storeByNorm[normalize(s.store)] = s);

    const agg = {};
    const unmatched = new Set();
    let skippedUnits = 0;
    for(let r=headerRowIdx+1; r<rows.length; r++){
      const row = rows[r];
      if(!row || !row[1]) continue;
      const storeName = String(row[1]);
      const catLabel = String(row[2]||'');
      const catCode = BULK_CAT_MAP[catLabel];
      const store = storeByNorm[normalize(storeName)];
      if(!store){ unmatched.add(storeName); continue; }
      dayCols.forEach(dc=>{
        const v = Number(row[dc.col])||0;
        if(v<=0) return;
        if(!catCode){ skippedUnits += v; return; }
        const iso = `${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-${pad(dc.day)}`;
        if(!agg[store.code]) agg[store.code] = {};
        if(!agg[store.code][iso]) agg[store.code][iso] = {SP:0,Tab:0,WR:0,AUD:0};
        agg[store.code][iso][catCode] += v;
      });
    }
    bulkParsedAgg = agg; bulkUnmatched = [...unmatched]; bulkSkippedUnits = skippedUnits;
    renderBulkPreview();
  }catch(err){
    if(preview) preview.innerHTML = `<div class="footer-note" style="color:var(--red);">Error leyendo el archivo: ${escapeHtml(String(err))}</div>`;
  }
}

function renderBulkPreview(){
  const preview = document.getElementById('bulkPreview');
  if(!preview) return;
  if(!bulkParsedAgg){ preview.innerHTML=''; return; }
  const storeCount = Object.keys(bulkParsedAgg).length;
  let dayCount = 0, totalUnits = 0;
  Object.values(bulkParsedAgg).forEach(byDate=>{
    Object.values(byDate).forEach(cats=>{
      dayCount++;
      totalUnits += CAT_ORDER.reduce((a,c)=>a+numOr0(cats[c]),0);
    });
  });
  preview.innerHTML = `
    <div style="margin-top:12px;padding:12px;background:var(--surface-2);border-radius:12px;font-size:12.5px;line-height:1.5;">
      <div><b>${storeCount}</b> tiendas reconocidas · <b>${dayCount}</b> registros tienda-día · <b>${fmt(totalUnits)}</b> unidades a cargar</div>
      ${bulkSkippedUnits>0 ? `<div style="color:var(--amber);margin-top:6px;">⚠️ ${fmt(bulkSkippedUnits)} unidades de "Other"/"Home" no se cargaron — no tienen categoría equivalente en la app.</div>` : ''}
      ${bulkUnmatched.length ? `<div style="color:var(--red);margin-top:6px;">⚠️ ${bulkUnmatched.length} tiendas del archivo no se reconocieron: ${bulkUnmatched.slice(0,8).map(escapeHtml).join(', ')}${bulkUnmatched.length>8?'…':''}</div>` : ''}
    </div>
    <button class="primary" id="bulkConfirmBtn" style="margin-top:12px;">Confirmar y cargar ${fmt(totalUnits)} unidades</button>
    <div id="bulkProgress" class="footer-note" style="padding-top:10px;"></div>
  `;
  document.getElementById('bulkConfirmBtn').addEventListener('click', runBulkUpload);
}

/* Reparte la venta oficial de un día entre los roles reales de la tienda:
   - Tiendas de 1 solo promotor: todo va a ese único rol, sin dividir.
   - Tiendas con especialista de Tablets: el 100% de Tablets va para él;
     Smartphones/Wearables/Audio se reparten en partes iguales entre el
     resto de promotores.
   - Tiendas con varios promotores "generales" (sin especialista): las 4
     categorías se reparten en partes iguales entre todos ellos. */
function splitCatsAcrossRoles(store, cats){
  const roles = storeRoles(store);
  if(roles.length<=1){
    return [{ roleKey: roles[0] ? roles[0].key : 'P1', cats }];
  }
  const tabRole = roles.find(r=>r.key==='TAB');
  const generalRoles = roles.filter(r=>r.key!=='TAB');
  const n = Math.max(1, generalRoles.length);
  const jobs = [];
  if(tabRole){
    if(numOr0(cats.Tab) > 0){
      jobs.push({ roleKey: tabRole.key, cats: {SP:0, Tab:cats.Tab, WR:0, AUD:0} });
    }
    generalRoles.forEach(r=>{
      jobs.push({ roleKey: r.key, cats: {SP:numOr0(cats.SP)/n, Tab:0, WR:numOr0(cats.WR)/n, AUD:numOr0(cats.AUD)/n} });
    });
  } else {
    generalRoles.forEach(r=>{
      jobs.push({ roleKey: r.key, cats: {
        SP:numOr0(cats.SP)/n, Tab:numOr0(cats.Tab)/n, WR:numOr0(cats.WR)/n, AUD:numOr0(cats.AUD)/n
      }});
    });
  }
  return jobs;
}

async function runBulkUpload(){
  const btn = document.getElementById('bulkConfirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Cargando...'; }
  const progressEl = document.getElementById('bulkProgress');
  const jobs = [];
  Object.entries(bulkParsedAgg).forEach(([code, byDate])=>{
    const store = STORES.find(s=>s.code===code);
    Object.entries(byDate).forEach(([iso, cats])=>{
      splitCatsAcrossRoles(store, cats).forEach(j=> jobs.push({code, iso, roleKey:j.roleKey, cats:j.cats}));
    });
  });
  let done = 0, failed = 0;
  for(const job of jobs){
    const ok = await saveEntry(job.code, job.iso, job.roleKey, job.cats);
    if(!ok) failed++;
    done++;
    if(progressEl) progressEl.textContent = `Cargando ${done}/${jobs.length}...${failed?` (${failed} con error)`:''}`;
  }
  showToast(failed ? `Carga terminada con ${failed} error(es) de ${jobs.length}` : 'Carga masiva completada ✓');
  bulkParsedAgg = null; bulkUnmatched = []; bulkSkippedUnits = 0;
  renderAdmin();
}

/* ---------- helpers de gráficos SVG (sin librerías externas) ---------- */
function svgHBarChart(items, opts){
  // items: [{label, value, max, color}]
  opts = opts || {};
  const barH = opts.barH || 20, gap = opts.gap || 10, labelW = opts.labelW || 110, w = opts.width || 300;
  const chartW = w - labelW - 46;
  const h = items.length*(barH+gap);
  const rows = items.map((it,i)=>{
    const y = i*(barH+gap);
    const pct = it.max>0 ? Math.min(1, it.value/it.max) : 0;
    const bw = Math.max(2, pct*chartW);
    return `
      <text x="0" y="${y+barH*0.7}" font-size="11" fill="var(--ink-soft)" font-family="Inter">${escapeHtml(it.label)}</text>
      <rect x="${labelW}" y="${y+2}" width="${chartW}" height="${barH-4}" rx="5" fill="var(--surface)"/>
      <rect x="${labelW}" y="${y+2}" width="${bw}" height="${barH-4}" rx="5" fill="${it.color||'var(--red)'}"/>
      <text x="${labelW+chartW+8}" y="${y+barH*0.7}" font-size="11" font-weight="700" fill="var(--ink)" font-family="Poppins">${Math.round(pct*100)}%</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${rows}</svg>`;
}

function svgDonutChart(segments, size){
  // segments: [{value, color, label}]
  size = size || 150;
  const total = segments.reduce((a,s)=>a+s.value,0);
  const r = size/2 - 14, c = size/2, circ = 2*Math.PI*r;
  let offset = 0;
  const arcs = total<=0 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--border)" stroke-width="20"/>` : segments.filter(s=>s.value>0).map(s=>{
    const frac = s.value/total;
    const dash = frac*circ;
    const rotate = (offset/total)*360 - 90;
    offset += s.value;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${dash} ${circ}" transform="rotate(${rotate} ${c} ${c})"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${arcs}
    <text x="${c}" y="${c+6}" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="20" fill="var(--ink)">${total}</text>
  </svg>`;
}

/* ---------- exportación a Excel (SheetJS, cargado por CDN) ---------- */
function exportExcel(filename, sheets){
  if(typeof XLSX === 'undefined'){ showToast('No se pudo cargar el motor de Excel, revisa tu conexión'); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(sh=>{
    const ws = XLSX.utils.aoa_to_sheet(sh.aoa);
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0,31));
  });
  XLSX.writeFile(wb, filename);
}

  const isWeek = adminViewMode==='week';
  const pctKey = isWeek ? 'pctWeek' : 'pctMonth';
  const soldKey = isWeek ? 'weekSold' : 'totalSold';
  const targetKey = isWeek ? 'weekTarget' : 'target';
  const sorted = [...byChannel].sort((a,b)=> a[pctKey]-b[pctKey]);

  const totalTarget = sorted.reduce((a,r)=>a+r[targetKey],0);
  const totalSoldAll = sorted.reduce((a,r)=>a+r[soldKey],0);
  const overallPct = totalTarget>0 ? Math.round(totalSoldAll/totalTarget*100) : 0;
  const cumpliendoList = sorted.filter(r=>r[pctKey]>=100);
  const noCumpliendoList = sorted.filter(r=>r[pctKey]<100);
  const zeroGeneralList = sorted.filter(r=>numOr0(r[soldKey])===0);

  const catSoldOf = (r,c)=> isWeek ? r.soldByCatWeek[c] : r.soldByCatMonth[c];
  const zeroCatCount = {};
  CAT_ORDER.forEach(c=> zeroCatCount[c] = sorted.filter(r=>numOr0(catSoldOf(r,c))===0).length);

  let filtered = cumplFilter===null ? sorted : sorted.filter(r=>{
    const isCumpl = r[pctKey]>=100;
    return (cumplFilter.has('yes') && isCumpl) || (cumplFilter.has('no') && !isCumpl);
  });
  if(zeroFilter!==null){
    filtered = filtered.filter(r=>{
      return [...zeroFilter].some(key=>{
        if(key==='general') return numOr0(r[soldKey])===0;
        return numOr0(catSoldOf(r,key))===0;
      });
    });

  const chartItems = sorted.slice(0,8).map(r=>({label: r.store.length>16?r.store.slice(0,15)+'…':r.store, value: r[soldKey], max: Math.max(r[targetKey],1), color: r[pctKey]>=100?'#157F49':'#C7000B'}));

  const rowsHtml = filtered.map(r=>{
    const pct = r[pctKey];
    const color = pct>=100 ? 'var(--green)' : (isWeek ? (pct>=85?'var(--ink)':'var(--red)') : (r.projectedPct>=85?'var(--ink)':'var(--red)'));
    let roleLine = '';
    if(r.roles.length>1){
      const parts = r.roles.map(role=>`${role.label.replace('Promotor ','P')}: ${fmt(roleTotalForStat(r, role.key, adminViewMode, currentWeekNum()))}`);
      roleLine = `<div class="s" style="margin-top:2px;">${parts.join(' · ')}</div>`;
    }
    const sold = isWeek ? r.soldByCatWeek : r.soldByCatMonth;
    const tgt = isWeek ? r.targetByCatWeek : r.targetByCatMonth;
    const catLine = CAT_ORDER.map(c=>{
      const t = Math.max(0, tgt[c]||0);
      const p = t>0 ? Math.round(sold[c]/t*100) : (sold[c]>0?100:0);
      const isZero = numOr0(sold[c])===0;
      return `${CAT_LABEL[c]} <b style="color:${isZero?'var(--red)':(p>=100?'var(--green)':'var(--ink)')}">${isZero?'0':p+'%'}</b>`;
    }).join(' · ');

      <div class="an"><div class="n">${escapeHtml(r.store)}</div><div class="s">${r.code} · ${escapeHtml(r.supervisor||'')} · ${fmt(r[soldKey])}/${fmt(r[targetKey])}</div><div class="cat-mini">${catLine}</div>${roleLine}</div>
      <div class="ap" style="color:${color}">${Math.round(pct)}% <span class="chev">›</span></div>
    </div>`;

  const zeroChip = (key,label,count)=> `<span class="filter-chip zero-stat-click" data-val="${key}" style="${zeroFilter&&zeroFilter.has(key)?'background:var(--red);color:#fff;':''}">0 ${label} (${count})</span>`;

    <div class="cat-toggle" id="modeToggle">

  </div>
  <div class="admin-summary-band">
    <div class="stat" style="flex:1"><div class="v">${fmt(totalSoldAll)}</div><div class="l">Vendido</div></div>
    <div class="stat" style="flex:1"><div class="v">${fmt(totalTarget)}</div><div class="l">Target</div></div>
    <div class="stat" style="flex:1"><div class="v">${overallPct}%</div><div class="l">Cumplimiento</div></div>
  </div>
  <div class="admin-summary-band" style="padding-top:0;">
    <div class="stat cumpl-stat-click" data-val="yes" style="flex:1;background:var(--green-bg);cursor:pointer;${cumplFilter&&cumplFilter.has('yes')?'outline:2px solid var(--green);':''}"><div class="v" style="color:var(--green)">${cumpliendoList.length}</div><div class="l">Puntos cumpliendo</div></div>
    <div class="stat cumpl-stat-click" data-val="no" style="flex:1;background:var(--red-bg);cursor:pointer;${cumplFilter&&cumplFilter.has('no')?'outline:2px solid var(--red);':''}"><div class="v" style="color:var(--red)">${noCumpliendoList.length}</div><div class="l">Puntos sin cumplir</div></div>

    <div class="label-eyebrow">Reportaron 0 ventas — toca para filtrar (combinable)</div>
    <div class="cat-toggle">
      ${zeroChip('general','general',zeroGeneralList.length)}
      ${CAT_ORDER.map(c=>zeroChip(c, CAT_LABEL[c], zeroCatCount[c])).join('')}

  </div>
  <div class="section" style="padding-top:6px;">

    <div class="footer-note">Toca "Puntos cumpliendo" / "sin cumplir" para filtrar la lista. Ordenado de menor a mayor cumplimiento.</div>
  </div>`;
}

/* ---------- TAB: Carga de hoy (quién reportó y quién no) ---------- */
function renderTabCarga(byChannel, chipsHtml){
  if(!adminLoadDate) adminLoadDate = todayISO();
  const dateIso = adminLoadDate;

  const rows = byChannel.map(s=>{
    const norm = normalizedEntries(s.salesMap);
    const found = norm.find(([iso])=>iso===dateIso);
    const dayEntry = found ? found[1] : null;
    const loadedRoles = dayEntry ? dayPromoterEntries(dayEntry).filter(([,cats])=> CAT_ORDER.some(c=>Number(cats[c])>0)).map(([k])=>k) : [];
    const status = loadedRoles.length>=s.roles.length ? 'full' : (loadedRoles.length===0 ? 'none' : 'partial');
    return { ...s, loadedCount: loadedRoles.length, totalRoles: s.roles.length, loadedRoleKeys: loadedRoles, status };
  }).sort((a,b)=>{
    const order = {none:0, partial:1, full:2};
    return order[a.status]-order[b.status];
  });

  const full = rows.filter(r=>r.status==='full').length;
  const none = rows.filter(r=>r.status==='none').length;
  const partial = rows.length - full - none;

  const filtered = cargaFilter===null ? rows : rows.filter(r=>cargaFilter.has(r.status));

  const rowsHtml = filtered.map(r=>{
    let badge, color;
    if(r.status==='full'){ badge = 'Cargó'; color='var(--green)'; }
    else if(r.status==='none'){ badge = 'No ha cargado'; color='var(--red)'; }
    else { badge = `${r.loadedCount}/${r.totalRoles} promotores`; color='var(--amber)'; }
    let missingLine = '';
    if(r.roles.length>1 && r.status!=='full'){
      const missing = r.roles.filter(role=>!r.loadedRoleKeys.includes(role.key)).map(role=>role.label);
      missingLine = `<div class="s" style="margin-top:2px;color:var(--red);">Falta: ${missing.join(', ')}</div>`;
    }
    return `<div class="admin-row admin-row-click" style="align-items:flex-start;" data-code="${r.code}">
      <div class="an"><div class="n">${escapeHtml(r.store)}</div><div class="s">${r.code} · ${escapeHtml(r.supervisor||'')}</div>${missingLine}</div>
      <div class="ap" style="color:${color};font-size:12px;">${badge} <span class="chev">›</span></div>
    </div>`;
  }).join('');

  const outline = (key)=> cargaFilter && cargaFilter.has(key) ? 'outline:2px solid currentColor;' : '';

  return `
  <div class="section" style="padding-top:10px;padding-bottom:0;">
    <label class="fieldlabel">Ver carga del día</label>
    <input type="date" id="loadDateInput" value="${dateIso}" min="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-01" max="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-${pad(DAYS_IN_MONTH)}"/>
  </div>
  <div class="admin-summary-band">
    <div class="stat carga-stat-click" data-val="full" style="flex:1;background:var(--green-bg);color:var(--green);cursor:pointer;${outline('full')}"><div class="v" style="color:var(--green)">${full}</div><div class="l">Cargaron completo</div></div>
    <div class="stat carga-stat-click" data-val="partial" style="flex:1;background:var(--amber-bg);color:var(--amber);cursor:pointer;${outline('partial')}"><div class="v" style="color:var(--amber)">${partial}</div><div class="l">Carga parcial</div></div>
    <div class="stat carga-stat-click" data-val="none" style="flex:1;background:var(--red-bg);color:var(--red);cursor:pointer;${outline('none')}"><div class="v" style="color:var(--red)">${none}</div><div class="l">Sin cargar</div></div>
  </div>
  <div class="section" style="padding-top:6px;">
    <div class="adminChannelChips" style="margin-bottom:6px;">${chipsHtml}</div>
    <div class="card" style="display:flex;justify-content:center;">
      ${svgDonutChart([{value:full,color:'#157F49'},{value:partial,color:'#B8790A'},{value:none,color:'#C7000B'}], 140)}
    </div>
    <div class="card" style="padding:8px 14px;">
      ${rowsHtml || '<div class="empty-msg">Sin tiendas para este filtro.</div>'}
    </div>
    <button class="primary" id="downloadXlsxCarga" style="margin-top:4px;">Descargar Excel de esta vista</button>
    <div class="footer-note">Toca cualquiera de los 3 contadores de arriba para filtrar la lista (puedes combinar varios).</div>
  </div>`;
}

      <table style="border-collapse:collapse;width:100%;font-size:11.5px;white-space:nowrap;">

          <th style="text-align:left;padding:4px 6px;">Tienda</th>
          <th style="padding:4px 6px;">Smartphones</th><th style="padding:4px 6px;">Tablets</th>
          <th style="padding:4px 6px;">Wearables</th><th style="padding:4px 6px;">Audio</th>
          <th style="padding:4px 6px;">%</th>

    <div class="footer-note">El Excel incluye además el desglose por promotor en las tiendas con más de uno.</div>
  </div>`;

/* ---------- descargas Excel por pestaña ---------- */
function downloadCumplimientoXlsx(byChannel, mode, wNum){
  const isWeek = mode==='week';
  const pctKey = isWeek?'pctWeek':'pctMonth', soldKey = isWeek?'weekSold':'totalSold', targetKey = isWeek?'weekTarget':'target';
  const aoa = [['Tienda','Código','Supervisor','Canal','Vendido','Target','% Cumplimiento','SP %','Tab %','WR %','AUD %']];
  [...byChannel].sort((a,b)=>a[pctKey]-b[pctKey]).forEach(r=>{
    const sold = isWeek ? r.soldByCatWeek : r.soldByCatMonth;
    const tgt = isWeek ? r.targetByCatWeek : r.targetByCatMonth;
    const catPct = c => (tgt[c]>0 ? Math.round(sold[c]/tgt[c]*100) : (sold[c]>0?100:0));
    aoa.push([r.store, r.code, r.supervisor||'', r.account||r.channel||'', r[soldKey], r[targetKey], Math.round(r[pctKey])+'%',
      catPct('SP')+'%', catPct('Tab')+'%', catPct('WR')+'%', catPct('AUD')+'%']);
  });
  exportExcel(`cumplimiento_${mode}_${todayISO()}.xlsx`, [{name:'Cumplimiento', aoa}]);
}

function downloadCategoriaXlsx(byChannel, mode){
  const bySup = {};
  byChannel.forEach(s=>{
    const key = s.supervisor || 'Sin supervisor';
    if(!bySup[key]) bySup[key] = {sold:{SP:0,Tab:0,WR:0,AUD:0}, tgt:{SP:0,Tab:0,WR:0,AUD:0}};
    const sold = mode==='week' ? s.soldByCatWeek : s.soldByCatMonth;
    const tgt = mode==='week' ? s.targetByCatWeek : s.targetByCatMonth;
    CAT_ORDER.forEach(c=>{ bySup[key].sold[c]+=sold[c]; bySup[key].tgt[c]+=tgt[c]; });
  });
  const aoa = [['Supervisor','SP vendido','SP target','SP %','Tab vendido','Tab target','Tab %','WR vendido','WR target','WR %','AUD vendido','AUD target','AUD %']];
  Object.keys(bySup).sort((a,b)=>a.localeCompare(b,'es')).forEach(name=>{
    const g = bySup[name];
    const row = [name];
    CAT_ORDER.forEach(c=>{
      const pct = g.tgt[c]>0 ? Math.round(g.sold[c]/g.tgt[c]*100) : (g.sold[c]>0?100:0);
      row.push(g.sold[c], g.tgt[c], pct+'%');
    });
    aoa.push(row);
  });
  exportExcel(`cumplimiento_por_categoria_${mode}_${todayISO()}.xlsx`, [{name:'Por categoría', aoa}]);
}

function downloadCargaXlsx(byChannel, dateIso){
  const aoa = [['Tienda','Código','Supervisor','Estado','Promotores cargados','Total promotores','Roles faltantes']];
  byChannel.forEach(s=>{
    const norm = normalizedEntries(s.salesMap);
    const found = norm.find(([iso])=>iso===dateIso);
    const dayEntry = found ? found[1] : null;
    const loadedRoles = dayEntry ? dayPromoterEntries(dayEntry).filter(([,cats])=> CAT_ORDER.some(c=>Number(cats[c])>0)).map(([k])=>k) : [];
    const status = loadedRoles.length>=s.roles.length ? 'Completo' : (loadedRoles.length===0 ? 'Sin cargar' : 'Parcial');
    const missing = s.roles.filter(role=>!loadedRoles.includes(role.key)).map(role=>role.label).join(', ');
    aoa.push([s.store, s.code, s.supervisor||'', status, loadedRoles.length, s.roles.length, missing]);
  });
  exportExcel(`carga_diaria_${dateIso}.xlsx`, [{name:'Carga de hoy', aoa}]);
}

function downloadReporteXlsx(byChannel, mode, wNum){
  const aoa = [['Tienda','Codigo','Supervisor','Canal','SP vendido','SP target','Tab vendido','Tab target','WR vendido','WR target','AUD vendido','AUD target','Total vendido','Total target','% cumplimiento']];
  byChannel.forEach(r=>{
    const sold = mode==='week' ? r.soldByCatWeek : r.soldByCatMonth;
    const tgt = mode==='week' ? r.targetByCatWeek : r.targetByCatMonth;
    const totalSold = mode==='week' ? r.weekSold : r.totalSold;
    const totalTgt = mode==='week' ? r.weekTarget : r.target;
    const pct = totalTgt>0 ? Math.round(totalSold/totalTgt*100) : 0;
    aoa.push([r.store, r.code, r.supervisor||'', r.account||r.channel||'',
      sold.SP, tgt.SP, sold.Tab, tgt.Tab, sold.WR, tgt.WR, sold.AUD, tgt.AUD, totalSold, totalTgt, pct+'%']);
    if(r.roles.length>1){
      r.roles.forEach(role=>{
        const roleTotal = roleTotalForStat(r, role.key, mode, wNum);
        aoa.push(['   ↳ '+role.label, '', '', '', '', '', '', '', '', '', '', '', roleTotal, '', '']);
      });
    }
  });
  exportExcel(`reporte_cumplimiento_${mode}_${todayISO()}.xlsx`, [{name:'Reporte', aoa}]);
}

/* ---------- Vista de detalle de tienda (solo lectura, desde supervisión) ---------- */
let storeDetailViewMode = 'month'; // 'month' | 'week'

async function renderStoreDetail(code){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="section" style="text-align:center;color:#888;padding-top:60px;">Cargando detalle...</div>`;
  const store = STORES.find(s=>s.code===code);
  if(!store){ window.__storeDetailCode=null; renderAdmin(); return; }
  const all = await loadAllSales();
  const wNum = currentWeekNum();
  const stat = computeStoreStats(store, all, wNum);

  const isWeek = storeDetailViewMode==='week';
  const pctMonth = stat.pctMonth, pctWeek = stat.pctWeek;

  // avance por semana (todas las semanas)
  const now = new Date();
  const isCurrentMonth = now.getFullYear()===TARGET_YEAR && now.getMonth()===TARGET_MONTH;
  let weekHtml = '';
  WEEKS.forEach(w=>{
    const wt = Math.max(0, store.w ? store.w[w.num-1] : (store.target/WEEKS.length));
    let wSold = 0;
    stat.entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===w.num) wSold += dayTotal(e); });
    const wPct = wt>0 ? (wSold/wt*100) : 0;
    const isPast = isCurrentMonth ? (w.end < now && w.num !== wNum) : true;
    const isCurrent = isCurrentMonth && w.num===wNum;
    let badge;
    if(isCurrent) badge = `<span class="badge pill-amber">En curso</span>`;
    else if(isPast) badge = wPct>=100 ? `<span class="badge pill-green">Cumplió</span>` : `<span class="badge pill-red">No cumplió</span>`;
    else badge = `<span class="badge" style="background:var(--surface);color:var(--ink-soft);">Próxima</span>`;
    weekHtml += `<div class="week-card ${isCurrent?'current':''}">
      <div><div class="week-name">Semana ${w.num}${badge}</div>
        <div class="week-range">${w.start.toLocaleDateString('es-CO',{day:'numeric',month:'short'})} – ${w.end.toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</div></div>
      <div class="week-nums"><b>${fmt(wSold)}</b> / ${fmt(wt)}<br><span style="color:var(--ink-soft)">${Math.round(wPct)}%</span></div>
    </div>`;
  });

  // calendario de cargas del mes
  const loadedSet = new Set(stat.entries.map(([iso])=>iso));
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let missingPastCount = 0;
  let dayGridHtml = '';
  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const iso = `${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-${pad(d)}`;
    const dateObj = new Date(TARGET_YEAR, TARGET_MONTH, d);
    const loaded = loadedSet.has(iso);
    const isFuture = dateObj > today0;
    let cls = 'day-loaded';
    if(!loaded){ cls = isFuture ? 'day-future' : 'day-missing'; if(!isFuture) missingPastCount++; }
    dayGridHtml += `<div class="day-box ${cls}">${d}</div>`;
  }

  // desglose por rol (si aplica)
  let roleHtml = '';
  if(stat.roles.length>1){
    roleHtml = `<div class="card"><div class="label-eyebrow">Desglose por promotor</div>` +
      stat.roles.map(role=>{
        const total = roleTotalForStat(stat, role.key, storeDetailViewMode, wNum);
        return `<div class="week-card"><div class="week-name">${role.label}</div><div class="week-nums"><b>${fmt(total)}</b> u.</div></div>`;
      }).join('') + `</div>`;
  }

  // historial (todas las entradas del mes, más recientes primero)
  const sortedEntries = [...stat.entries].sort((a,b)=> a[0]<b[0]?1:-1);
  const histHtml = sortedEntries.slice(0,20).map(([iso,e])=>{
    const parts = CAT_ORDER.filter(c=>dayCat(e,c)>0).map(c=>`${CAT_LABEL[c]} ${dayCat(e,c)}`).join(' · ');
    return `<div class="hist-row">
      <div class="hist-top"><span class="hist-date">${dateLabel(iso)}</span><span class="hist-units">${fmt(dayTotal(e))} u.</span></div>
      ${parts? `<div class="hist-breakdown">${parts}</div>` : ''}
    </div>`;
  }).join('') || `<div class="hist-row" style="color:var(--ink-soft);text-align:center;">Aún no hay registros este mes.</div>`;

  app.innerHTML = `
  <div class="topbar">
    <button class="backbtn" id="backToAdmin">‹ Volver al resumen</button>
    <div class="eyebrow">${store.account || store.channel} · ${store.code} · ${escapeHtml(store.supervisor||'')}</div>
    <h1>${escapeHtml(store.store)}</h1>
  </div>
  <div class="section" style="padding-top:22px;">
    <div class="card">
      <div class="gauge-row">
        <div class="gauge-col">
          ${ringSvg(pctMonth, 148, 13, pctMonth>=100?'var(--green)':'var(--red)', 26)}
          <div class="gauge-tag">Mes</div>
          <div class="gauge-sub">${fmt(stat.totalSold)} / ${fmt(stat.target)} u.</div>
        </div>
        <div class="gauge-col">
          ${ringSvg(pctWeek, 148, 13, pctWeek>=100?'var(--green)':'var(--red)', 26)}
          <div class="gauge-tag">Semana ${wNum}</div>
          <div class="gauge-sub">${fmt(stat.weekSold)} / ${fmt(stat.weekTarget)} u.</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="v">${stat.entries.length}</div><div class="l">Días cargados</div></div>
        <div class="stat"><div class="v" style="color:${missingPastCount>0?'var(--red)':'var(--green)'}">${missingPastCount}</div><div class="l">Días sin cargar</div></div>
      </div>
    </div>

    <div class="card">
      <div class="label-eyebrow">Calendario de cargas · ${TARGET_MONTH_LABEL}</div>
      <div class="day-grid">${dayGridHtml}</div>
      <div class="day-legend">
        <span><i style="background:var(--green-bg);border:1px solid var(--green);"></i>Cargó</span>
        <span><i style="background:var(--red-bg);border:1px solid var(--red);"></i>No cargó</span>
        <span><i style="background:var(--surface);"></i>Aún no llega</span>
      </div>
    </div>

    <div class="card">
      <div class="label-eyebrow">Avance por categoría</div>
      <div class="cat-toggle" id="detailModeToggle">
        <span class="filter-chip ${storeDetailViewMode==='month'?'active':''}" data-mode="month">Este mes</span>
        <span class="filter-chip ${storeDetailViewMode==='week'?'active':''}" data-mode="week">Semana ${wNum}</span>
      </div>
      ${catRowsHtml(isWeek?stat.soldByCatWeek:stat.soldByCatMonth, isWeek?stat.targetByCatWeek:stat.targetByCatMonth)}
    </div>

    ${roleHtml}

    <div class="card">
      <div class="label-eyebrow">Avance por semana</div>
      ${weekHtml}
    </div>

    <div class="card">
      <div class="label-eyebrow">Historial de cargas</div>
      ${histHtml}
    </div>
  </div>
  `;
  document.getElementById('backToAdmin').addEventListener('click', ()=>{ window.__storeDetailCode=null; render(); });
  document.querySelectorAll('#detailModeToggle .filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ storeDetailViewMode = chip.dataset.mode; renderStoreDetail(code); });
  });
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
