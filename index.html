<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cumplimiento · Field Force</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C7000B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --red: #C7000B;
  --red-dark: #8F0009;
  --ink: #17181C;
  --ink-soft: #55565F;
  --surface: #F4F4F6;
  --border: #E4E4E8;
  --white: #FFFFFF;
  --green: #157F49;
  --green-bg: #EAF6EF;
  --amber: #B8790A;
  --amber-bg: #FBF2E2;
  --red-bg: #FCEAEA;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.num{font-family:'Poppins',system-ui,sans-serif;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--white);position:relative;padding-bottom:40px;}

/* ---------- top bar ---------- */
.topbar{
  background:linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
  color:#fff; padding:22px 20px 26px; position:relative; overflow:hidden;
}
.topbar::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.08);}
.topbar::before{content:"";position:absolute;right:20px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);}
.topbar .eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.85;font-weight:600;}
.topbar h1{font-size:20px;margin:4px 0 0;font-weight:700;}
.backbtn{background:rgba(255,255,255,0.18);border:none;color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;cursor:pointer;}
.backbtn:active{background:rgba(255,255,255,0.3);}

/* ---------- generic ---------- */
.section{padding:18px 20px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.label-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
input,select,button{font-family:inherit;font-size:15px;}
input,select{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--ink);
}
input:focus,select:focus{outline:none;border-color:var(--red);}
button.primary{
  width:100%;background:var(--red);color:#fff;border:none;border-radius:12px;
  padding:14px;font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s;
}
button.primary:active{transform:scale(0.98);background:var(--red-dark);}
button.ghost{
  background:none;border:1.5px solid var(--border);color:var(--ink);border-radius:12px;
  padding:10px 14px;font-weight:600;cursor:pointer;font-size:13px;
}

/* ---------- combobox / autocomplete ---------- */
.combo-wrap{padding:16px 20px 8px;position:relative;}
.combo-label{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
.combo-input-wrap{position:relative;}
.combo-input-wrap input{padding-right:36px;}
.combo-caret{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;font-size:12px;}
.combo-list{
  position:absolute;left:20px;right:20px;top:100%;margin-top:6px;
  background:var(--white);border:1.5px solid var(--border);border-radius:14px;
  max-height:320px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,0.12);z-index:40;
  display:none;
}
.combo-list.open{display:block;}
.combo-opt{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
.combo-opt:last-child{border-bottom:none;}
.combo-opt:hover, .combo-opt.hi{background:var(--surface);}
.combo-opt .n{font-weight:600;font-size:14px;}
.combo-opt .n mark{background:#FCEAEA;color:var(--red);border-radius:3px;padding:0 1px;}
.combo-opt .s{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.combo-empty{padding:16px;text-align:center;color:var(--ink-soft);font-size:13px;}

/* ---------- quota card ---------- */
.quota-card{background:linear-gradient(135deg, var(--ink) 0%, #2B2C33 100%);border:none;color:#fff;}
.quota-main-row{display:flex;align-items:center;gap:16px;margin-top:6px;}
.quota-big{font-family:'Poppins';font-weight:800;font-size:30px;line-height:1;}
.quota-tag{font-size:11px;color:rgba(255,255,255,0.65);margin-top:4px;}
.quota-div{width:1px;align-self:stretch;background:rgba(255,255,255,0.15);}
.quota-cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.quota-cat-chip{background:rgba(255,255,255,0.1);border-radius:10px;padding:7px 11px;font-size:11.5px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:70px;}
.quota-cat-chip span{color:rgba(255,255,255,0.65);}
.quota-cat-chip b{font-family:'Poppins';font-size:15px;}

/* ---------- gauges ---------- */
.gauge-row{display:flex;justify-content:center;gap:26px;padding:6px 0 2px;}
.gauge-col{display:flex;flex-direction:column;align-items:center;}
.gauge-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-top:6px;}
.gauge-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;text-align:center;}
.status-pill{
  display:inline-block;padding:5px 14px;border-radius:20px;font-size:12.5px;font-weight:700;margin-top:14px;
}
.pill-green{background:var(--green-bg);color:var(--green);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.pill-red{background:var(--red-bg);color:var(--red);}

.stat-row{display:flex;gap:10px;margin-top:14px;}
.stat{flex:1;background:var(--surface);border-radius:12px;padding:10px 12px;text-align:center;}
.stat .v{font-size:18px;font-weight:800;font-family:'Poppins';}
.stat .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

/* ---------- daily form (por categoria) ---------- */
.fieldlabel{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;display:block;}
.cat-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.cat-input-item{background:var(--surface);border-radius:12px;padding:10px 12px;}
.cat-input-item label{font-size:12px;font-weight:700;margin-bottom:6px;display:block;}
.cat-input-item input{background:var(--white);padding:10px 12px;}
.day-total-line{display:flex;justify-content:space-between;padding:12px 2px 0;font-size:13px;font-weight:700;color:var(--ink-soft);}
.day-total-line b{color:var(--ink);font-family:'Poppins';}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;z-index:50;
  max-width:80%;text-align:center;
}
.toast.show{opacity:1;bottom:34px;}

/* ---------- category bars ---------- */
.cat-toggle{display:flex;gap:6px;margin-bottom:12px;}
.cat-toggle .filter-chip{margin:0;}
.cat-row{margin-bottom:12px;}
.cat-row:last-child{margin-bottom:0;}
.cat-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.cat-head .cn{font-weight:700;}
.cat-head .cv{color:var(--ink-soft);}
.cat-bar-bg{background:var(--surface);border-radius:8px;height:9px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:8px;}

/* ---------- week cards ---------- */
.week-card{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);}
.week-card.current{background:var(--red-bg);border-radius:10px;padding:12px 10px;border-bottom:none;margin-bottom:4px;}
.week-card:last-child{border-bottom:none;}
.week-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;}
.week-range{font-size:11px;color:var(--ink-soft);}
.week-nums{text-align:right;font-size:13px;}
.week-nums b{font-family:'Poppins';}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;margin-left:8px;}

/* history */
.hist-row{padding:9px 4px;border-bottom:1px dashed var(--border);}
.hist-row:last-child{border-bottom:none;}
.hist-top{display:flex;justify-content:space-between;font-size:13px;}
.hist-date{color:var(--ink-soft);}
.hist-units{font-weight:700;}
.hist-breakdown{font-size:11px;color:var(--ink-soft);margin-top:2px;}

/* admin table */
.admin-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);}
.admin-row .an{flex:1;min-width:0;}
.admin-row .an .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-row .an .s{font-size:11px;color:var(--ink-soft);}
.admin-row .ap{width:74px;text-align:right;font-weight:800;font-family:'Poppins';font-size:14px;}
.filter-chip{
  display:inline-block;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);
  font-size:12.5px;font-weight:600;margin-right:6px;margin-bottom:8px;cursor:pointer;color:var(--ink-soft);
}
.filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.admin-summary-band{display:flex;gap:10px;padding:14px 20px 4px;}
.linkbtn{background:none;border:none;color:var(--red);font-weight:700;font-size:13px;cursor:pointer;padding:0;}
.day-grid{display:flex;flex-wrap:wrap;gap:6px;}
.day-box{width:15.8%;aspect-ratio:1;min-width:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.day-loaded{background:var(--green-bg);color:var(--green);}
.day-missing{background:var(--red-bg);color:var(--red);}
.day-future{background:var(--surface);color:var(--ink-soft);font-weight:500;}
.day-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--ink-soft);}
.day-legend span{display:inline-flex;align-items:center;gap:5px;}
.day-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.admin-row-click:active{background:var(--surface);}
.cat-mini{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
.cat-mini b{font-weight:700;}
.ap .chev{color:var(--ink-soft);font-size:13px;margin-left:2px;}
.footer-note{font-size:11px;color:var(--ink-soft);text-align:center;padding:14px 30px 0;}
.empty-msg{text-align:center;color:var(--ink-soft);padding:20px 10px;font-size:13px;}
</style>

/* Roles de promotor por tienda. La mayoría de tiendas tiene 1 solo promotor
   (rol implícito 'P1', sin pedir selección). Las que tienen más de 1
   (s.promoters > 1) piden elegir "Promotor 1/2/3...". Las que además tienen
   un promotor exclusivo de Tablets (s.tabletSpecialist) suman un rol "TAB"
   que solo reporta esa categoría, y el resto de roles de esa tienda dejan
   de reportar Tablets (esa cuota es 100% del especialista). */
function storeRoles(store){
  const roles = [];
  const n = Math.max(1, store.promoters || 1);
  for(let i=1;i<=n;i++) roles.push({ key: 'P'+i, label: 'Promotor '+i, cats: (store.tabletSpecialist ? CAT_ORDER.filter(c=>c!=='Tab') : CAT_ORDER) });
  if(store.tabletSpecialist) roles.push({ key: 'TAB', label: 'Promotor Tablets', cats: ['Tab'] });
  return roles;
}

function fmt(n){ return Math.round(n).toLocaleString('es-CO'); }

/* normaliza claves de fecha: acepta 'yyyy-MM-dd' o el formato Date.toString() de JS
   (por si alguna fila del Sheet quedó guardada como fecha real en vez de texto) */
function normalizeIsoKey(key){
  if(/^\d{4}-\d{2}-\d{2}$/.test(key)) return key;
  const d = new Date(key);
  if(!isNaN(d.getTime())){
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  return key;
}
function normalizedEntries(salesMap){
  return Object.entries(salesMap||{}).map(([iso,e])=>[normalizeIsoKey(iso), e]);
}
function todayISO(){

  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);

function normalize(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlightMatch(text, term){
  if(!term) return escapeHtml(text);
  const nText = normalize(text);
  const nTerm = normalize(term);
  const idx = nText.indexOf(nTerm);
  if(idx===-1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+term.length)) + '</mark>' + escapeHtml(text.slice(idx+term.length));
}
/* Un día guardado puede venir en 3 formas (por compatibilidad con datos viejos):
   - número suelto (formato inicial)                         -> 1 solo promotor
   - {SP:n, Tab:n, WR:n, AUD:n} (formato sin roles)           -> 1 solo promotor
   - {P1:{SP:n,...}, P2:{...}, TAB:{...}} (formato con roles) -> multi-promotor
   dayPromoterEntries() siempre devuelve [ [rolKey, {SP,Tab,WR,AUD}], ... ] */
function isRoleMap(obj){
  const keys = Object.keys(obj);
  return keys.length>0 && keys.every(k=>/^(P\d+|TAB)$/.test(k));
}
function dayPromoterEntries(entry){
  if(!entry) return [];
  if(typeof entry === 'number') return [['P1', {SP:entry,Tab:0,WR:0,AUD:0}]];
  if(isRoleMap(entry)) return Object.entries(entry);
  return [['P1', entry]];
}
function dayTotal(entry){
  return dayPromoterEntries(entry).reduce((a,[,cats])=> a + CAT_ORDER.reduce((s,c)=>s+Number(cats[c]||0),0), 0);
}
function dayCat(entry, cat){
  return dayPromoterEntries(entry).reduce((a,[,cats])=> a + Number(cats[cat]||0), 0);
}
function dayRole(entry, roleKey){
  const found = dayPromoterEntries(entry).find(([k])=>k===roleKey);
  return found ? found[1] : {SP:0,Tab:0,WR:0,AUD:0};
}


/* Semanas del mes derivadas de los pesos W1..W4 del archivo de target,
   repartidas en bloques consecutivos de días (W1 primero, ... W4 = saldo). */
function buildWeeks(){
  const weeks = [];
  let dayCursor = 1;
  let assigned = 0;
  for(let i=0;i<WEEK_WEIGHTS.length;i++){
    const isLast = i===WEEK_WEIGHTS.length-1;
    let numDays;
    if(isLast){ numDays = DAYS_IN_MONTH - assigned; }
    else { numDays = Math.round(WEEK_WEIGHTS[i]*DAYS_IN_MONTH); }
    const start = new Date(TARGET_YEAR, TARGET_MONTH, dayCursor);
    const end = new Date(TARGET_YEAR, TARGET_MONTH, dayCursor+numDays-1);
    weeks.push({num:i+1, start, end, weight:WEEK_WEIGHTS[i]});
    dayCursor += numDays; assigned += numDays;
  }
  return weeks;
}
const WEEKS = buildWeeks();

function weekOfDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  for(const w of WEEKS){ if(dt >= w.start && dt <= w.end) return w.num; }
  return null;
}
function currentWeekNum(){
  const now = new Date();
  if(now.getFullYear()===TARGET_YEAR && now.getMonth()===TARGET_MONTH){
    return weekOfDate(todayISO()) || WEEKS[WEEKS.length-1].num;
  }
  return WEEKS[WEEKS.length-1].num;
}

/* ============ storage (Google Sheets vía Apps Script, JSONP) ============
   Usamos una etiqueta <script> en vez de fetch() para evitar por completo
   los problemas de CORS al conectar con Apps Script.                     */
function jsonpRequest(params){
  return new Promise((resolve, reject)=>{
    const cbName = '__jsonp_cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timeoutId;
    function cleanup(){
      clearTimeout(timeoutId);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    const qs = new URLSearchParams({...params, callback: cbName}).toString();
    script.src = `${API_URL}?${qs}`;
    script.onerror = ()=>{ cleanup(); reject(new Error('jsonp load error')); };
    timeoutId = setTimeout(()=>{ cleanup(); reject(new Error('jsonp timeout')); }, 12000);
    document.body.appendChild(script);
  });
}

async function loadAllSales(){

    const data = await jsonpRequest({action:'getAll', t: Date.now()});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); // respaldo local por si falla la conexión
    return data;
  }catch(e){
    showToast('Sin conexión al servidor, mostrando último dato guardado');
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e2){ return {}; }
  }
}
async function saveEntry(storeCode, iso, roleKey, catAmounts){
  try{
    const data = await jsonpRequest({
      action:'save', storeCode, date: iso, promoter: roleKey || 'P1',
      SP: catAmounts.SP||0, Tab: catAmounts.Tab||0, WR: catAmounts.WR||0, AUD: catAmounts.AUD||0
    });
    return !!(data && data.ok);
  }catch(e){ return false; }
}

function bindAuthGate(){
  document.getElementById('authBack').addEventListener('click', ()=>{ authStage=null; authError=''; render(); });
  document.querySelectorAll('.cat-toggle .filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ authRole = chip.dataset.role; authError=''; render(); });
  });
  const submit = ()=>{
    const pass = document.getElementById('authPassInput').value;
    if(authRole==='admin'){
      if(pass===ADMIN_PASSWORD){
        window.__showAdmin = true; window.__adminScope = null;
        authStage=null; authError=''; render();
      } else { authError = 'Contraseña incorrecta.'; render(); }
    } else {
      const supName = document.getElementById('authSupSelect').value;
      if(pass===SUPERVISOR_PASSWORD){
        const sup = SUPERVISORS.find(s=>s.name===supName);
        window.__showAdmin = true;
        window.__adminScope = sup ? {supervisor: sup.name, codes: sup.codes} : null;
        authStage=null; authError=''; render();
      } else { authError = 'Contraseña incorrecta.'; render(); }
    }
  };
  document.getElementById('authSubmit').addEventListener('click', submit);
  document.getElementById('authPassInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
}

/* ---------- PICKER (combobox con autocompletado, orden alfabético) ---------- */
const SORTED_STORES = [...STORES].sort((a,b)=> a.store.localeCompare(b.store,'es'));

function comboFilteredList(){
  const term = comboTerm.trim();
  if(!term) return SORTED_STORES;
  const nTerm = normalize(term);
  return SORTED_STORES.filter(s => normalize(s.store).includes(nTerm) || normalize(s.code).includes(nTerm));
}

function renderPicker(){
  return `
  <div class="topbar">
    <div class="eyebrow">Field Force · Cumplimiento</div>
    <h1>Elige tu punto de venta</h1>
  </div>
  <div class="combo-wrap">
    <label class="combo-label">Punto de venta</label>
    <div class="combo-input-wrap">
      <input id="comboInput" autocomplete="off" placeholder="Escribe el nombre de tu tienda..." value="${escapeHtml(comboTerm)}" />
      <span class="combo-caret">▾</span>
      <div id="comboList" class="combo-list ${comboOpen?'open':''}"></div>
    </div>
  </div>
  <div class="footer-note" style="padding-top:26px;"><span class="linkbtn" id="adminLink">Acceso de supervisión</span></div>
  `;
}

function renderComboList(){
  const list = document.getElementById('comboList');
  if(!list) return;
  const items = comboFilteredList();
  if(items.length===0){
    list.innerHTML = `<div class="combo-empty">No encontramos tiendas con ese nombre.</div>`;
  } else {
    list.innerHTML = items.map((s,i)=>`
      <div class="combo-opt ${i===comboHi?'hi':''}" data-code="${s.code}">
        <div class="n">${highlightMatch(s.store, comboTerm)}</div>
        <div class="s">${s.code} · ${s.account||s.channel||''}${s.supervisor?(' · '+escapeHtml(s.supervisor)):''}</div>
      </div>`).join('');
  }
  list.classList.toggle('open', comboOpen);
  list.querySelectorAll('.combo-opt').forEach(el=>{
    el.addEventListener('mousedown', (e)=>{ e.preventDefault(); selectStore(el.dataset.code); });
  });
}

function selectStore(code){
  currentStore = STORES.find(s=>s.code===code);
  selectedRoleKey = null;
  comboTerm = ""; comboOpen = false; comboHi = -1;
  render();
}

function bindPicker(){
  const input = document.getElementById('comboInput');
  renderComboList();
  input.addEventListener('focus', ()=>{ comboOpen = true; comboHi=-1; renderComboList(); });
  input.addEventListener('input', (e)=>{ comboTerm = e.target.value; comboOpen = true; comboHi = -1; renderComboList(); });
  input.addEventListener('keydown', (e)=>{
    const items = comboFilteredList();
    if(e.key==='ArrowDown'){ e.preventDefault(); comboHi = Math.min(items.length-1, comboHi+1); renderComboList(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); comboHi = Math.max(0, comboHi-1); renderComboList(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(comboHi>=0 && items[comboHi]) selectStore(items[comboHi].code); }
    else if(e.key==='Escape'){ comboOpen=false; renderComboList(); }
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.combo-input-wrap')){ comboOpen=false; const l=document.getElementById('comboList'); if(l) l.classList.remove('open'); }
  }, {once:true});
  const al = document.getElementById('adminLink');
  if(al) al.addEventListener('click', ()=>{ authStage='gate'; authError=''; render(); });
}

/* ---------- DASHBOARD ---------- */
function ringSvg(pct, size, strokeW, color, fontSize){
  const r = (size/2) - strokeW;
  const circ = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct));
  const dash = (clamped/100)*circ;
  const c = size/2;
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeW}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c+fontSize*0.35}" text-anchor="middle" style="font-family:Poppins;font-weight:800;font-size:${fontSize}px;fill:var(--ink);">${Math.round(pct)}%</text>
  </svg>`;
}

function catRowsHtml(soldByCat, targetByCat){
  return CAT_ORDER.map(c=>{
    const sold = soldByCat[c]||0;
    const tgt = Math.max(0, targetByCat[c]||0);
    const pct = tgt>0 ? Math.min(100, sold/tgt*100) : (sold>0?100:0);
    return `<div class="cat-row">
      <div class="cat-head"><span class="cn">${CAT_LABEL[c]}</span><span class="cv">${fmt(sold)} / ${fmt(tgt)} · ${tgt>0?Math.round(sold/tgt*100):0}%</span></div>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${CAT_COLOR[c]};"></div></div>
    </div>`;
  }).join('');
}

  const totalSold = entries.reduce((a,[,e])=>a+dayTotal(e),0);
  const target = currentStore.target;
  const pctMonth = target>0 ? (totalSold/target*100) : 0;

  const roles = storeRoles(currentStore);
  if(!selectedRoleKey || !roles.find(r=>r.key===selectedRoleKey)) selectedRoleKey = roles[0].key;
  const activeRole = roles.find(r=>r.key===selectedRoleKey);

  // -------- semana actual --------
  const wNum = currentWeekNum();
  const weekTarget = Math.max(0, currentStore.w ? currentStore.w[wNum-1] : (target/WEEKS.length));
  let weekSold = 0;
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) weekSold += dayTotal(e); });
  const pctWeek = weekTarget>0 ? (weekSold/weekTarget*100) : 0;

  // -------- proyección: según días efectivamente cargados y días hábiles restantes --------
  const daysWorked = entries.length;
  const dailyAvg = daysWorked>0 ? totalSold/daysWorked : 0;
  const daysRemaining = Math.max(0, WORKING_DAYS_PER_MONTH - daysWorked);
  const projected = totalSold + dailyAvg*daysRemaining;
  const projectedPct = target>0 ? (projected/target*100) : 0;
  const st = statusFor(projectedPct);

  // -------- categorías (mes o semana según toggle) --------
  const soldByCatMonth = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([,e])=>{ CAT_ORDER.forEach(c=> soldByCatMonth[c]+=dayCat(e,c)); });
  const soldByCatWeek = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) CAT_ORDER.forEach(c=> soldByCatWeek[c]+=dayCat(e,c)); });
  const targetByCatMonth = currentStore.cat_target || {SP:0,Tab:0,WR:0,AUD:0};
  const targetByCatWeek = {};
  CAT_ORDER.forEach(c=> targetByCatWeek[c] = currentStore.cat_w && currentStore.cat_w[c] ? currentStore.cat_w[c][wNum-1] : 0);

  // -------- todas las semanas --------
  const now = new Date();
  const isCurrentMonth = now.getFullYear()===TARGET_YEAR && now.getMonth()===TARGET_MONTH;
  let weekHtml = '';
  WEEKS.forEach(w=>{
    const wt = Math.max(0, currentStore.w ? currentStore.w[w.num-1] : (target/WEEKS.length));
    let wSold = 0;
    entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===w.num) wSold += dayTotal(e); });
    const wPct = wt>0 ? (wSold/wt*100) : 0;
    const isPast = isCurrentMonth ? (w.end < now && w.num !== wNum) : true;
    const isCurrent = isCurrentMonth && w.num===wNum;
    let badge;
    if(isCurrent) badge = `<span class="badge pill-amber">En curso</span>`;
    else if(isPast) badge = wPct>=100 ? `<span class="badge pill-green">Cumplió</span>` : `<span class="badge pill-red">No cumplió</span>`;
    else badge = `<span class="badge" style="background:var(--surface);color:var(--ink-soft);">Próxima</span>`;
    weekHtml += `<div class="week-card ${isCurrent?'current':''}">
      <div><div class="week-name">Semana ${w.num}${badge}</div>
        <div class="week-range">${w.start.toLocaleDateString('es-CO',{day:'numeric',month:'short'})} – ${w.end.toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</div></div>
      <div class="week-nums"><b>${fmt(wSold)}</b> / ${fmt(wt)}<br><span style="color:var(--ink-soft)">${Math.round(wPct)}%</span></div>
    </div>`;
  });

  // history (last 10)
  const sortedEntries = [...entries].sort((a,b)=> a[0]<b[0]?1:-1);
  let histHtml = sortedEntries.slice(0,10).map(([iso,e])=>{
    const parts = CAT_ORDER.filter(c=>dayCat(e,c)>0).map(c=>`${CAT_LABEL[c]} ${dayCat(e,c)}`).join(' · ');
    return `<div class="hist-row">
      <div class="hist-top"><span class="hist-date">${dateLabel(iso)}</span><span class="hist-units">${fmt(dayTotal(e))} u.</span></div>
      ${parts? `<div class="hist-breakdown">${parts}</div>` : ''}
    </div>`;
  }).join('') || `<div class="hist-row" style="color:var(--ink-soft);text-align:center;">Aún no hay registros este mes.</div>`;

  app.innerHTML = `
  <div class="topbar">
    <button class="backbtn" id="backBtn">‹ Cambiar tienda</button>
    <div class="eyebrow">${currentStore.account || currentStore.channel} · ${currentStore.code}</div>
    <h1>${currentStore.store}</h1>
  </div>

  <div class="section" style="padding-top:22px;">
    <div class="card quota-card">
      <div class="label-eyebrow" style="color:rgba(255,255,255,0.75);">Tu cuota · ${TARGET_MONTH_LABEL}</div>
      <div class="quota-main-row">
        <div><div class="quota-big">${fmt(target)}</div><div class="quota-tag">unidades este mes</div></div>
        <div class="quota-div"></div>
        <div><div class="quota-big">${fmt(weekTarget)}</div><div class="quota-tag">Semana ${wNum} (actual)</div></div>
      </div>
      <div class="quota-cats">
        ${CAT_ORDER.map(c=>`<div class="quota-cat-chip"><span>${CAT_LABEL[c]}</span><b>${fmt(Math.max(0,(currentStore.cat_target&&currentStore.cat_target[c])||0))}</b></div>`).join('')}

    <div class="card">

        <div class="gauge-col">
          ${ringSvg(pctMonth, 148, 13, pctMonth>=100?'var(--green)':'var(--red)', 26)}
          <div class="gauge-tag">Mes</div>
          <div class="gauge-sub">${fmt(totalSold)} / ${fmt(target)} u.</div>
        </div>
        <div class="gauge-col">
          ${ringSvg(pctWeek, 148, 13, pctWeek>=100?'var(--green)':'var(--red)', 26)}
          <div class="gauge-tag">Semana ${wNum}</div>
          <div class="gauge-sub">${fmt(weekSold)} / ${fmt(weekTarget)} u.</div>
        </div>
      </div>
      <div style="text-align:center;">
        <span class="status-pill ${st.cls}">${st.label}</span>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="v">${daysWorked}</div><div class="l">Días cargados</div></div>
        <div class="stat"><div class="v">${fmt(dailyAvg)}</div><div class="l">Prom. x día</div></div>
        <div class="stat"><div class="v">${fmt(projected)}</div><div class="l">Proy. cierre mes</div></div>
      </div>
    </div>

    <div class="card">
      <div class="label-eyebrow">Registrar ventas de hoy — por categoría</div>
      ${roles.length>1 ? `
      <label class="fieldlabel" style="margin-top:6px;">¿Quién eres?</label>
      <div class="cat-toggle" id="roleToggle">
        ${roles.map(r=>`<span class="filter-chip ${r.key===selectedRoleKey?'active':''}" data-role="${r.key}">${r.label}</span>`).join('')}
      </div>
      ` : ``}
      <label class="fieldlabel" style="margin-top:6px;">Fecha</label>
      <input type="date" id="dateInput" value="${todayISO()}" min="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-01" max="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-${pad(DAYS_IN_MONTH)}"/>
      <div class="cat-input-grid" id="catInputGrid">
        ${activeRole.cats.map(c=>`
        <div class="cat-input-item">
          <label>${CAT_LABEL[c]}</label>
          <input type="number" min="0" inputmode="numeric" placeholder="0" class="catInput" data-cat="${c}" />
        </div>`).join('')}
      </div>
      <div class="day-total-line"><span>Total del día</span><b id="dayTotalPreview">0</b></div>
      <div style="height:12px;"></div>
      <button class="primary" id="saveBtn">Guardar venta del día</button>
    </div>

    <div class="card">
      <div class="label-eyebrow">Avance por categoría</div>
      <div class="cat-toggle" id="catViewToggle">
        <span class="filter-chip ${catViewMode==='month'?'active':''}" data-mode="month">Este mes</span>
        <span class="filter-chip ${catViewMode==='week'?'active':''}" data-mode="week">Semana ${wNum}</span>
      </div>
      <div id="catRows">${catRowsHtml(catViewMode==='month'?soldByCatMonth:soldByCatWeek, catViewMode==='month'?targetByCatMonth:targetByCatWeek)}</div>
    </div>

    </div>

  document.getElementById('backBtn').addEventListener('click', ()=>{ currentStore=null; selectedRoleKey=null; render(); });

    document.querySelectorAll('.catInput').forEach(inp=>{

  });

/* ---------- ADMIN SUMMARY ---------- */
function computeStoreStats(s, all, wNum){
  const salesMap = all[s.code] || {};
  const entries = normalizedEntries(salesMap).filter(([iso])=> iso.startsWith(`${TARGET_YEAR}-${pad(TARGET_MONTH+1)}`));
  const totalSold = entries.reduce((a,[,e])=>a+dayTotal(e),0);
  const pctMonth = s.target>0 ? (totalSold/s.target*100) : 0;
  const daysWorked = entries.length;
  const dailyAvg = daysWorked>0 ? totalSold/daysWorked : 0;
  const daysRemaining = Math.max(0, WORKING_DAYS_PER_MONTH - daysWorked);
  const projectedPct = s.target>0 ? ((totalSold + dailyAvg*daysRemaining)/s.target*100) : 0;

  const weekTarget = Math.max(0, s.w ? s.w[wNum-1] : (s.target/WEEKS.length));
  let weekSold = 0;
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) weekSold += dayTotal(e); });
  const pctWeek = weekTarget>0 ? (weekSold/weekTarget*100) : 0;

  const soldByCatMonth = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([,e])=> CAT_ORDER.forEach(c=> soldByCatMonth[c]+=dayCat(e,c)));
  const soldByCatWeek = {SP:0,Tab:0,WR:0,AUD:0};
  entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===wNum) CAT_ORDER.forEach(c=> soldByCatWeek[c]+=dayCat(e,c)); });
  const targetByCatMonth = s.cat_target || {SP:0,Tab:0,WR:0,AUD:0};
  const targetByCatWeek = {};
  CAT_ORDER.forEach(c=> targetByCatWeek[c] = Math.max(0, s.cat_w && s.cat_w[c] ? s.cat_w[c][wNum-1] : 0));

  const roles = storeRoles(s);

  return {...s, totalSold, pctMonth, projectedPct, weekTarget, weekSold, pctWeek,
    soldByCatMonth, soldByCatWeek, targetByCatMonth, targetByCatWeek, roles, salesMap, entries};
}

function roleTotalForStat(stat, roleKey, mode, wNum){
  const ents = mode==='week' ? stat.entries.filter(([iso])=>weekOfDate(iso)===wNum) : stat.entries;
  return ents.reduce((a,[,e])=>{
    const r = dayRole(e, roleKey);
    return a + CAT_ORDER.reduce((s,c)=>s+Number(r[c]||0),0);
  }, 0);
}

  });
  document.querySelectorAll('.adminChannelChips .filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ adminFilter = chip.dataset.ch; renderAdmin(); });
  });
  document.querySelectorAll('.admin-row-click').forEach(row=>{
    row.addEventListener('click', ()=> openStoreDetail(row.dataset.code));
  });
  if(adminTab==='cumplimiento'){
    document.querySelectorAll('#modeToggle .filter-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{ adminViewMode = chip.dataset.mode; renderAdmin(); });
    });
  }
  if(adminTab==='categoria'){
    document.querySelectorAll('#modeToggle .filter-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{ adminViewMode = chip.dataset.mode; renderAdmin(); });
    });
  }
  if(adminTab==='reporte'){
    document.querySelectorAll('#modeToggle .filter-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{ adminViewMode = chip.dataset.mode; renderAdmin(); });
    });
    const dlBtn = document.getElementById('downloadCsvBtn');
    if(dlBtn) dlBtn.addEventListener('click', ()=> downloadReportCsv(byChannel, adminViewMode, wNum));
  }
  if(adminTab==='carga'){
    const dateInp = document.getElementById('loadDateInput');
    if(dateInp) dateInp.addEventListener('change', (e)=>{ adminLoadDate = e.target.value; renderAdmin(); });
  }
}

/* ---------- TAB: Cumplimiento ---------- */
function renderTabCumplimiento(byChannel, wNum, chipsHtml){
  const isWeek = adminViewMode==='week';
  const pctKey = isWeek ? 'pctWeek' : 'pctMonth';
  const soldKey = isWeek ? 'weekSold' : 'totalSold';
  const targetKey = isWeek ? 'weekTarget' : 'target';
  const filtered = [...byChannel].sort((a,b)=> a[pctKey]-b[pctKey]);

  const totalTarget = filtered.reduce((a,r)=>a+r[targetKey],0);
  const totalSoldAll = filtered.reduce((a,r)=>a+r[soldKey],0);
  const overallPct = totalTarget>0 ? Math.round(totalSoldAll/totalTarget*100) : 0;
  const cumpliendo = filtered.filter(r=>r[pctKey]>=100).length;
  const noCumpliendo = filtered.length - cumpliendo;

  const rowsHtml = filtered.map(r=>{
    const pct = r[pctKey];
    const color = pct>=100 ? 'var(--green)' : (isWeek ? (pct>=85?'var(--ink)':'var(--red)') : (r.projectedPct>=85?'var(--ink)':'var(--red)'));
    let roleLine = '';
    if(r.roles.length>1){
      const parts = r.roles.map(role=>`${role.label.replace('Promotor ','P')}: ${fmt(roleTotalForStat(r, role.key, adminViewMode, currentWeekNum()))}`);
      roleLine = `<div class="s" style="margin-top:2px;">${parts.join(' · ')}</div>`;
    }
    const sold = isWeek ? r.soldByCatWeek : r.soldByCatMonth;
    const tgt = isWeek ? r.targetByCatWeek : r.targetByCatMonth;
    const catLine = CAT_ORDER.map(c=>{
      const t = Math.max(0, tgt[c]||0);
      const p = t>0 ? Math.round(sold[c]/t*100) : (sold[c]>0?100:0);
      return `${CAT_LABEL[c]} <b style="color:${p>=100?'var(--green)':'var(--ink)'}">${p}%</b>`;
    }).join(' · ');
    return `<div class="admin-row admin-row-click" style="align-items:flex-start;" data-code="${r.code}">
      <div class="an"><div class="n">${escapeHtml(r.store)}</div><div class="s">${r.code} · ${escapeHtml(r.supervisor||'')} · ${fmt(r[soldKey])}/${fmt(r[targetKey])}</div><div class="cat-mini">${catLine}</div>${roleLine}</div>
      <div class="ap" style="color:${color}">${Math.round(pct)}% <span class="chev">›</span></div>
    </div>`;
  }).join('');

  return `
  <div class="section" style="padding-top:10px;padding-bottom:0;">
    <div class="cat-toggle" id="modeToggle">
      <span class="filter-chip ${adminViewMode==='month'?'active':''}" data-mode="month">General (mes)</span>
      <span class="filter-chip ${adminViewMode==='week'?'active':''}" data-mode="week">Semana ${wNum}</span>
    </div>
  </div>
  <div class="admin-summary-band">
    <div class="stat" style="flex:1"><div class="v">${fmt(totalSoldAll)}</div><div class="l">Vendido</div></div>
    <div class="stat" style="flex:1"><div class="v">${fmt(totalTarget)}</div><div class="l">Target</div></div>
    <div class="stat" style="flex:1"><div class="v">${overallPct}%</div><div class="l">Cumplimiento</div></div>
  </div>
  <div class="admin-summary-band" style="padding-top:0;">
    <div class="stat" style="flex:1;background:var(--green-bg);"><div class="v" style="color:var(--green)">${cumpliendo}</div><div class="l">Puntos cumpliendo</div></div>
    <div class="stat" style="flex:1;background:var(--red-bg);"><div class="v" style="color:var(--red)">${noCumpliendo}</div><div class="l">Puntos sin cumplir</div></div>
  </div>
  <div class="section" style="padding-top:6px;">
    <div class="adminChannelChips" style="margin-bottom:6px;">${chipsHtml}</div>
    <div class="card" style="padding:8px 14px;">
      ${rowsHtml || '<div class="empty-msg">Sin datos para este filtro.</div>'}
    </div>
    <div class="footer-note">Ordenado de menor a mayor cumplimiento, para priorizar seguimiento.</div>
  </div>`;
}

/* ---------- TAB: Por categoría (agrupado por supervisor) ---------- */
function renderTabCategoria(byChannel){
  const wNum = currentWeekNum();
  const bySup = {};
  byChannel.forEach(s=>{
    const key = s.supervisor || 'Sin supervisor';
    if(!bySup[key]) bySup[key] = {sold:{SP:0,Tab:0,WR:0,AUD:0}, tgt:{SP:0,Tab:0,WR:0,AUD:0}};
    const sold = adminViewMode==='week' ? s.soldByCatWeek : s.soldByCatMonth;
    const tgt = adminViewMode==='week' ? s.targetByCatWeek : s.targetByCatMonth;
    CAT_ORDER.forEach(c=>{ bySup[key].sold[c]+=sold[c]; bySup[key].tgt[c]+=tgt[c]; });
  });
  const groupsHtml = Object.keys(bySup).sort((a,b)=>a.localeCompare(b,'es')).map(name=>{
    const g = bySup[name];
    const totalSold = CAT_ORDER.reduce((a,c)=>a+g.sold[c],0);
    const totalTgt = CAT_ORDER.reduce((a,c)=>a+g.tgt[c],0);
    const pct = totalTgt>0 ? Math.round(totalSold/totalTgt*100) : 0;
    return `<div class="card">
      <div class="label-eyebrow" style="display:flex;justify-content:space-between;">
        <span>${escapeHtml(name)}</span><span style="color:${pct>=100?'var(--green)':'var(--ink-soft)'};font-weight:700;">${pct}%</span>
      </div>
      ${catRowsHtml(g.sold, g.tgt)}
    </div>`;
  }).join('');

  return `
  <div class="section" style="padding-top:10px;padding-bottom:0;">
    <div class="cat-toggle" id="modeToggle">
      <span class="filter-chip ${adminViewMode==='month'?'active':''}" data-mode="month">General (mes)</span>
      <span class="filter-chip ${adminViewMode==='week'?'active':''}" data-mode="week">Semana ${wNum}</span>
    </div>
  </div>
  <div class="section" style="padding-top:6px;">
    ${groupsHtml || '<div class="empty-msg">Sin datos para este filtro.</div>'}
  </div>`;
}

/* ---------- TAB: Carga de hoy (quién reportó y quién no) ---------- */
function renderTabCarga(byChannel, chipsHtml){
  if(!adminLoadDate) adminLoadDate = todayISO();
  const dateIso = adminLoadDate;

  const rows = byChannel.map(s=>{
    const norm = normalizedEntries(s.salesMap);
    const found = norm.find(([iso])=>iso===dateIso);
    const dayEntry = found ? found[1] : null;
    const loadedRoles = dayEntry ? dayPromoterEntries(dayEntry).filter(([,cats])=> CAT_ORDER.some(c=>Number(cats[c])>0)).map(([k])=>k) : [];
    return { ...s, loadedCount: loadedRoles.length, totalRoles: s.roles.length, loadedRoleKeys: loadedRoles };
  }).sort((a,b)=>{
    const aFull = a.loadedCount>=a.totalRoles ? 1 : 0;
    const bFull = b.loadedCount>=b.totalRoles ? 1 : 0;
    return aFull-bFull;
  });

  const full = rows.filter(r=>r.loadedCount>=r.totalRoles).length;
  const none = rows.filter(r=>r.loadedCount===0).length;
  const partial = rows.length - full - none;

  const rowsHtml = rows.map(r=>{
    let badge, color;
    if(r.loadedCount>=r.totalRoles){ badge = 'Cargó'; color='var(--green)'; }
    else if(r.loadedCount===0){ badge = 'No ha cargado'; color='var(--red)'; }
    else { badge = `${r.loadedCount}/${r.totalRoles} promotores`; color='var(--amber)'; }
    let missingLine = '';
    if(r.roles.length>1 && r.loadedCount<r.totalRoles){
      const missing = r.roles.filter(role=>!r.loadedRoleKeys.includes(role.key)).map(role=>role.label);
      missingLine = `<div class="s" style="margin-top:2px;color:var(--red);">Falta: ${missing.join(', ')}</div>`;
    }
    return `<div class="admin-row" style="align-items:flex-start;">
      <div class="an"><div class="n">${escapeHtml(r.store)}</div><div class="s">${r.code} · ${escapeHtml(r.supervisor||'')}</div>${missingLine}</div>
      <div class="ap" style="color:${color};font-size:12px;">${badge}</div>
    </div>`;
  }).join('');

  return `
  <div class="section" style="padding-top:10px;padding-bottom:0;">
    <label class="fieldlabel">Ver carga del día</label>
    <input type="date" id="loadDateInput" value="${dateIso}" min="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-01" max="${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-${pad(DAYS_IN_MONTH)}"/>
  </div>
  <div class="admin-summary-band">
    <div class="stat" style="flex:1;background:var(--green-bg);"><div class="v" style="color:var(--green)">${full}</div><div class="l">Cargaron completo</div></div>
    <div class="stat" style="flex:1;background:var(--amber-bg);"><div class="v" style="color:var(--amber)">${partial}</div><div class="l">Carga parcial</div></div>
    <div class="stat" style="flex:1;background:var(--red-bg);"><div class="v" style="color:var(--red)">${none}</div><div class="l">Sin cargar</div></div>
  </div>
  <div class="section" style="padding-top:6px;">
    <div class="adminChannelChips" style="margin-bottom:6px;">${chipsHtml}</div>
    <div class="card" style="padding:8px 14px;">
      ${rowsHtml || '<div class="empty-msg">Sin tiendas para este filtro.</div>'}
    </div>
  </div>`;
}

    <div class="footer-note">El CSV incluye además el desglose por promotor en las tiendas con más de uno.</div>
  </div>`;
}

function downloadReportCsv(byChannel, mode, wNum){
  const header = ['Tienda','Codigo','Supervisor','Canal','SP vendido','SP target','Tab vendido','Tab target','WR vendido','WR target','AUD vendido','AUD target','Total vendido','Total target','% cumplimiento'];
  const rows = [header];
  byChannel.forEach(r=>{
    const sold = mode==='week' ? r.soldByCatWeek : r.soldByCatMonth;
    const tgt = mode==='week' ? r.targetByCatWeek : r.targetByCatMonth;
    const totalSold = mode==='week' ? r.weekSold : r.totalSold;
    const totalTgt = mode==='week' ? r.weekTarget : r.target;
    const pct = totalTgt>0 ? Math.round(totalSold/totalTgt*100) : 0;
    rows.push([r.store, r.code, r.supervisor||'', r.account||r.channel||'',
      sold.SP, tgt.SP, sold.Tab, tgt.Tab, sold.WR, tgt.WR, sold.AUD, tgt.AUD, totalSold, totalTgt, pct+'%']);
    if(r.roles.length>1){
      r.roles.forEach(role=>{
        const roleTotal = roleTotalForStat(r, role.key, mode, wNum);
        rows.push(['   ↳ '+role.label, '', '', '', '', '', '', '', '', '', '', '', roleTotal, '', '']);
      });
    }
  });
  const csv = rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `reporte_cumplimiento_${mode}_${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Vista de detalle de tienda (solo lectura, desde supervisión) ---------- */
let storeDetailViewMode = 'month'; // 'month' | 'week'

async function renderStoreDetail(code){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="section" style="text-align:center;color:#888;padding-top:60px;">Cargando detalle...</div>`;
  const store = STORES.find(s=>s.code===code);
  if(!store){ window.__storeDetailCode=null; renderAdmin(); return; }
  const all = await loadAllSales();
  const wNum = currentWeekNum();
  const stat = computeStoreStats(store, all, wNum);

  const isWeek = storeDetailViewMode==='week';
  const pctMonth = stat.pctMonth, pctWeek = stat.pctWeek;

  // avance por semana (todas las semanas)
  const now = new Date();
  const isCurrentMonth = now.getFullYear()===TARGET_YEAR && now.getMonth()===TARGET_MONTH;
  let weekHtml = '';
  WEEKS.forEach(w=>{
    const wt = Math.max(0, store.w ? store.w[w.num-1] : (store.target/WEEKS.length));
    let wSold = 0;
    stat.entries.forEach(([iso,e])=>{ if(weekOfDate(iso)===w.num) wSold += dayTotal(e); });
    const wPct = wt>0 ? (wSold/wt*100) : 0;
    const isPast = isCurrentMonth ? (w.end < now && w.num !== wNum) : true;
    const isCurrent = isCurrentMonth && w.num===wNum;
    let badge;
    if(isCurrent) badge = `<span class="badge pill-amber">En curso</span>`;
    else if(isPast) badge = wPct>=100 ? `<span class="badge pill-green">Cumplió</span>` : `<span class="badge pill-red">No cumplió</span>`;
    else badge = `<span class="badge" style="background:var(--surface);color:var(--ink-soft);">Próxima</span>`;
    weekHtml += `<div class="week-card ${isCurrent?'current':''}">
      <div><div class="week-name">Semana ${w.num}${badge}</div>
        <div class="week-range">${w.start.toLocaleDateString('es-CO',{day:'numeric',month:'short'})} – ${w.end.toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</div></div>
      <div class="week-nums"><b>${fmt(wSold)}</b> / ${fmt(wt)}<br><span style="color:var(--ink-soft)">${Math.round(wPct)}%</span></div>
    </div>`;
  });

  // calendario de cargas del mes
  const loadedSet = new Set(stat.entries.map(([iso])=>iso));
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let missingPastCount = 0;
  let dayGridHtml = '';
  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const iso = `${TARGET_YEAR}-${pad(TARGET_MONTH+1)}-${pad(d)}`;
    const dateObj = new Date(TARGET_YEAR, TARGET_MONTH, d);
    const loaded = loadedSet.has(iso);
    const isFuture = dateObj > today0;
    let cls = 'day-loaded';
    if(!loaded){ cls = isFuture ? 'day-future' : 'day-missing'; if(!isFuture) missingPastCount++; }
    dayGridHtml += `<div class="day-box ${cls}">${d}</div>`;
  }

  // desglose por rol (si aplica)
  let roleHtml = '';
  if(stat.roles.length>1){
    roleHtml = `<div class="card"><div class="label-eyebrow">Desglose por promotor</div>` +
      stat.roles.map(role=>{
        const total = roleTotalForStat(stat, role.key, storeDetailViewMode, wNum);
        return `<div class="week-card"><div class="week-name">${role.label}</div><div class="week-nums"><b>${fmt(total)}</b> u.</div></div>`;
      }).join('') + `</div>`;
  }

  // historial (todas las entradas del mes, más recientes primero)
  const sortedEntries = [...stat.entries].sort((a,b)=> a[0]<b[0]?1:-1);
  const histHtml = sortedEntries.slice(0,20).map(([iso,e])=>{
    const parts = CAT_ORDER.filter(c=>dayCat(e,c)>0).map(c=>`${CAT_LABEL[c]} ${dayCat(e,c)}`).join(' · ');
    return `<div class="hist-row">
      <div class="hist-top"><span class="hist-date">${dateLabel(iso)}</span><span class="hist-units">${fmt(dayTotal(e))} u.</span></div>
      ${parts? `<div class="hist-breakdown">${parts}</div>` : ''}
    </div>`;
  }).join('') || `<div class="hist-row" style="color:var(--ink-soft);text-align:center;">Aún no hay registros este mes.</div>`;

  app.innerHTML = `
  <div class="topbar">
    <button class="backbtn" id="backToAdmin">‹ Volver al resumen</button>
    <div class="eyebrow">${store.account || store.channel} · ${store.code} · ${escapeHtml(store.supervisor||'')}</div>
    <h1>${escapeHtml(store.store)}</h1>
  </div>
  <div class="section" style="padding-top:22px;">
    <div class="card">
      <div class="gauge-row">
        <div class="gauge-col">
          ${ringSvg(pctMonth, 148, 13, pctMonth>=100?'var(--green)':'var(--red)', 26)}
          <div class="gauge-tag">Mes</div>
          <div class="gauge-sub">${fmt(stat.totalSold)} / ${fmt(stat.target)} u.</div>
        </div>
        <div class="gauge-col">
          ${ringSvg(pctWeek, 148, 13, pctWeek>=100?'var(--green)':'var(--red)', 26)}
          <div class="gauge-tag">Semana ${wNum}</div>
          <div class="gauge-sub">${fmt(stat.weekSold)} / ${fmt(stat.weekTarget)} u.</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="v">${stat.entries.length}</div><div class="l">Días cargados</div></div>
        <div class="stat"><div class="v" style="color:${missingPastCount>0?'var(--red)':'var(--green)'}">${missingPastCount}</div><div class="l">Días sin cargar</div></div>
      </div>
    </div>

    <div class="card">
      <div class="label-eyebrow">Calendario de cargas · ${TARGET_MONTH_LABEL}</div>
      <div class="day-grid">${dayGridHtml}</div>
      <div class="day-legend">
        <span><i style="background:var(--green-bg);border:1px solid var(--green);"></i>Cargó</span>
        <span><i style="background:var(--red-bg);border:1px solid var(--red);"></i>No cargó</span>
        <span><i style="background:var(--surface);"></i>Aún no llega</span>
      </div>
    </div>

    <div class="card">
      <div class="label-eyebrow">Avance por categoría</div>
      <div class="cat-toggle" id="detailModeToggle">
        <span class="filter-chip ${storeDetailViewMode==='month'?'active':''}" data-mode="month">Este mes</span>
        <span class="filter-chip ${storeDetailViewMode==='week'?'active':''}" data-mode="week">Semana ${wNum}</span>
      </div>
      ${catRowsHtml(isWeek?stat.soldByCatWeek:stat.soldByCatMonth, isWeek?stat.targetByCatWeek:stat.targetByCatMonth)}
    </div>

    ${roleHtml}

    <div class="card">
      <div class="label-eyebrow">Avance por semana</div>
      ${weekHtml}
    </div>

    <div class="card">
      <div class="label-eyebrow">Historial de cargas</div>
      ${histHtml}
    </div>
  </div>
  `;
  document.getElementById('backToAdmin').addEventListener('click', ()=>{ window.__storeDetailCode=null; render(); });
  document.querySelectorAll('#detailModeToggle .filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ storeDetailViewMode = chip.dataset.mode; renderStoreDetail(code); });
  });
}

render();
