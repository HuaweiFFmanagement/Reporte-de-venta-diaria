<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --red: #C7000B;
  --red-dark: #8F0009;
  --ink: #17181C;
  --ink-soft: #6B6C76;
  --surface: #F7F7F9;
  --surface-2: #F0F1F3;
  --border: #ECECEF;
  --white: #FFFFFF;
  --green: #157F49;
  --green-bg: #EAF6EF;
  --amber: #B8790A;
  --amber-bg: #FBF2E2;
  --red-bg: #FCEAEA;
  --shadow-sm: 0 1px 2px rgba(20,20,30,0.04);
  --shadow-md: 0 4px 16px rgba(20,20,30,0.05), 0 1px 3px rgba(20,20,30,0.04);
  --shadow-lg: 0 16px 40px rgba(20,20,30,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Poppins',system-ui,sans-serif;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface);position:relative;padding-bottom:96px;}

.topbar{
  background:linear-gradient(150deg, var(--red) 0%, var(--red-dark) 100%);
  color:#fff; padding:26px 22px 30px; position:relative; overflow:hidden;
  border-radius:0 0 28px 28px;
}
.topbar::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,0.07);}
.topbar::before{content:"";position:absolute;right:10px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.05);}
.topbar .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;opacity:0.8;font-weight:600;position:relative;}
.topbar h1{font-size:21px;margin:5px 0 0;font-weight:700;letter-spacing:-0.2px;position:relative;}
.backbtn{background:rgba(255,255,255,0.16);border:none;color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;cursor:pointer;position:relative;text-decoration:none;}
.backbtn:active{background:rgba(255,255,255,0.28);}

.section{padding:18px 20px;}
.card{background:var(--white);box-shadow:var(--shadow-md);border-radius:20px;padding:18px;margin-bottom:14px;}
.label-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:700;margin-bottom:10px;}

.cat-toggle{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap;overflow-x:auto;}
.filter-chip{
  display:inline-block;padding:8px 14px;border-radius:20px;border:none;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
  background:var(--surface-2);white-space:nowrap;
}
.filter-chip.active{background:var(--ink);color:#fff;}

select{
  width:100%;padding:13px 14px;border-radius:14px;border:none;
  background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14.5px;
  font-weight:600;
}

.prod-card{background:var(--white);box-shadow:var(--shadow-sm);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;border:2px solid transparent;transition:border-color .15s;}
.prod-card.selected{border-color:var(--red);}
.prod-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800;}
.prod-card.selected .prod-check{background:var(--red);border-color:var(--red);}
.prod-info{flex:1;min-width:0;}
.prod-brand{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);letter-spacing:0.4px;}
.prod-brand.hw{background:var(--red);color:#fff;}
.prod-ref{font-size:13.5px;font-weight:700;margin-top:5px;line-height:1.3;}
.prod-price-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;}
.prod-price{font-family:'Poppins';font-weight:800;font-size:15px;}
.prod-store{font-size:10.5px;color:var(--ink-soft);}
.prod-nd{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin-top:6px;}

.compare-bar{
  position:fixed;left:0;right:0;bottom:0;background:var(--white);
  box-shadow:0 -8px 24px rgba(0,0,0,0.08);padding:14px 20px;
  display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto;
  border-radius:20px 20px 0 0;z-index:30;
}
.compare-bar .count{font-size:13px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
.compare-bar button.primary{
  flex:1;background:var(--red);color:#fff;border:none;border-radius:14px;
  padding:13px;font-weight:700;font-size:14px;cursor:pointer;
}
.compare-bar button.primary:disabled{background:var(--surface-2);color:var(--ink-soft);cursor:not-allowed;}
.compare-bar button.ghost{background:var(--surface-2);border:none;color:var(--ink);border-radius:14px;padding:13px 16px;font-weight:600;cursor:pointer;font-size:13px;}

.spec-table{width:100%;border-collapse:collapse;}
.spec-table th{text-align:left;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;padding:8px 6px;border-bottom:2px solid var(--border);}
.spec-table td{padding:11px 6px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:top;}
.spec-table tr:last-child td{border-bottom:none;}
.spec-label{color:var(--ink-soft);font-weight:600;width:34%;}
.spec-val{font-weight:600;}
.spec-val.best{color:var(--green);}
.price-row td{background:var(--green-bg);}
.compare-head{padding:14px 6px 10px;}
.compare-head-brand{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);}
.compare-head-brand.hw{background:var(--red);color:#fff;}
.compare-head-ref{font-size:12.5px;font-weight:700;margin-top:5px;line-height:1.25;}

.empty-msg{text-align:center;color:var(--ink-soft);padding:24px 10px;font-size:13px;}
.footer-note{font-size:11px;color:var(--ink-soft);text-align:center;padding:10px 30px 0;line-height:1.6;}
</style>
</head>

nd"}}]}, "Premium": {"range": "$500K+", "products": [{"brand": "HUAWEI", "ref": "Mesh X3 PRO WiFi7", "isHw": 1, "specs": {"Estándar": "WiFi 7", "Velocidad": "3.6Gbps", "Bandas": "2", "Cobertura": "No publicado por el fabricante", "Puertos": "2x 2.5Gbps (WAN/LAN)", "RAM": "512MB", "ROM": "No publicado por el fabricante", "IP": "—"}, "q": {"must": ["mesh x3 pro wifi7"], "not": [], "cap": "", "fb": "huawei", "cq": "huawei mesh x3 pro wifi7"}, "p": {"Alkosto": {"now": 699900, "was": 899900, "cmr": null}, "Falabella": "nd", "Claro": "nd"}}, {"brand": "HUAWEI", "ref": "Mesh X1 Pro WiFi7", "isHw": 1, "specs": {"Estándar": "WiFi 7", "Velocidad": "3.6Gbps", "Bandas": "2", "Cobertura": "~200m²", "Puertos": "4x 2.5GbE (10/100/1000M/2500M)", "RAM": "512MB", "ROM": "128MB", "IP": "—"}, "q": {"must": ["mesh x1 pro wifi7"], "not": [], "cap": "", "fb": "huawei", "cq": "huawei mesh x1 pro wifi7"}, "p": {"Alkosto": {"now": 549900, "was": 669900, "cmr": null}, "Falabella": "nd", "Claro": "nd"}}, {"brand": "TPLINK", "ref": "Deco X20 AX1800", "isHw": 0, "specs": {"Estándar": "WiFi 6", "Velocidad": "1.8Gbps", "Bandas": "2", "Cobertura": "~200m² por unidad", "Puertos": "2x Gigabit (1 WAN + 1 LAN)", "RAM": "512MB", "ROM": "No publicado por el fabricante", "IP": "—"}, "q": {"must": ["deco x20 ax1800"], "not": [], "cap": "", "fb": "tp-link", "cq": "tplink deco x20 ax1800"}, "p": {"Alkosto": {"now": 629900, "was": 729900, "cmr": null}, "Falabella": "nd", "Claro": "nd"}}]}}};
const CAT_ICON = {Smartphones:'📱', Tablets:'📲', Wearables:'⌚', Audio:'🎧', Routers:'📡'};
const STORES = ['Alkosto','Falabella','Claro'];

let currentCategory = 'Smartphones';
let currentSegment = Object.keys(SEGS_DATA['Smartphones'])[0];
let selected = []; // hasta 2 productos: {category, segment, idx}
let view = 'list'; // 'list' | 'compare'

function fmtCOP(n){
  if(n===null || n===undefined) return null;
  return '$' + Math.round(n).toLocaleString('es-CO');
}
function bestPrice(p){
  let best = null, store = null;
  STORES.forEach(s=>{
    const v = p.p[s];
    if(v && v!=='nd' && typeof v.now === 'number' && v.now>0){
      if(best===null || v.now<best){ best = v.now; store = s; }
    }
  });
  return best===null ? null : {price:best, store};
}
function productKey(category, segment, idx){ return `${category}|${segment}|${idx}`; }
function isSelected(category, segment, idx){
  const k = productKey(category, segment, idx);
  return selected.some(s=>productKey(s.category,s.segment,s.idx)===k);
}
function toggleSelect(category, segment, idx){
  const k = productKey(category, segment, idx);
  const existingIdx = selected.findIndex(s=>productKey(s.category,s.segment,s.idx)===k);
  if(existingIdx>=0){ selected.splice(existingIdx,1); }
  else {
    if(selected.length>=2) selected.shift(); // mantiene máximo 2, descarta el más viejo
    selected.push({category, segment, idx});
  }
  render();
}

function render(){
  if(view==='compare' && selected.length===2) renderCompare();
  else renderList();
}

function renderList(){
  const app = document.getElementById('app');
  const categories = Object.keys(SEGS_DATA);
  const segments = Object.keys(SEGS_DATA[currentCategory]);
  const segData = SEGS_DATA[currentCategory][currentSegment];
  const products = segData ? segData.products : [];

  const listHtml = products.map((p,idx)=>{
    const bp = bestPrice(p);
    const sel = isSelected(currentCategory, currentSegment, idx);
    return `<div class="prod-card ${sel?'selected':''}" data-idx="${idx}">
      <div class="prod-check">${sel?'✓':''}</div>
      <div class="prod-info">
        <span class="prod-brand ${p.isHw?'hw':''}">${escapeHtml(p.brand)}</span>
        <div class="prod-ref">${escapeHtml(p.ref)}</div>
        ${bp ? `<div class="prod-price-row"><span class="prod-price">${fmtCOP(bp.price)}</span><span class="prod-store">mejor precio · ${bp.store}</span></div>` : `<div class="prod-nd">Sin precio disponible</div>`}
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
  <div class="topbar">
    <a href="index.html" class="backbtn">‹ Huawei Retail System</a>
    <div class="eyebrow">Field Force · Competitive Intelligence</div>
    <h1>Compara productos</h1>
  </div>
  <div class="section" style="padding-top:20px;">
    <div class="card">
      <div class="label-eyebrow">Categoría</div>
      <div class="cat-toggle" id="catToggle">
        ${categories.map(c=>`<span class="filter-chip ${c===currentCategory?'active':''}" data-cat="${escapeHtml(c)}">${CAT_ICON[c]||''} ${escapeHtml(c)}</span>`).join('')}
      </div>
      <div class="label-eyebrow" style="margin-top:14px;">Segmento</div>
      <select id="segSelect">
        ${segments.map(s=>`<option value="${escapeHtml(s)}" ${s===currentSegment?'selected':''}>${escapeHtml(s)} (${escapeHtml(SEGS_DATA[currentCategory][s].range||'')})</option>`).join('')}
      </select>
    </div>
    <div class="label-eyebrow" style="padding:0 4px;">Toca hasta 2 productos para comparar</div>
    ${listHtml || '<div class="empty-msg">No hay productos en este segmento.</div>'}
    <div class="footer-note">Los precios son una referencia tomada de un corte reciente — pueden variar en tienda.</div>
  </div>
  <div class="compare-bar">
    <div class="count">${selected.length}/2 seleccionados</div>
    <button class="ghost" id="clearBtn">Limpiar</button>
    <button class="primary" id="compareBtn" ${selected.length!==2?'disabled':''}>Comparar</button>
  </div>
  `;

  document.querySelectorAll('#catToggle .filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentCategory = chip.dataset.cat;
      currentSegment = Object.keys(SEGS_DATA[currentCategory])[0];
      render();
    });
  });
  const segSelect = document.getElementById('segSelect');
  if(segSelect) segSelect.addEventListener('change', (e)=>{ currentSegment = e.target.value; render(); });

  document.querySelectorAll('.prod-card').forEach(card=>{
    card.addEventListener('click', ()=> toggleSelect(currentCategory, currentSegment, Number(card.dataset.idx)));
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{ selected = []; render(); });
  const compareBtn = document.getElementById('compareBtn');
  if(compareBtn) compareBtn.addEventListener('click', ()=>{ if(selected.length===2){ view='compare'; render(); } });
}

function getProduct(sel){ return SEGS_DATA[sel.category][sel.segment].products[sel.idx]; }

function renderCompare(){
  const app = document.getElementById('app');
  const [a,b] = selected.map(getProduct);
  const allSpecKeys = [...new Set([...Object.keys(a.specs||{}), ...Object.keys(b.specs||{})])];

  const headHtml = `
    <div style="display:flex;">
      <div style="width:34%;"></div>
      <div style="flex:1;" class="compare-head">
        <span class="compare-head-brand ${a.isHw?'hw':''}">${escapeHtml(a.brand)}</span>
        <div class="compare-head-ref">${escapeHtml(a.ref)}</div>
      </div>
      <div style="flex:1;" class="compare-head">
        <span class="compare-head-brand ${b.isHw?'hw':''}">${escapeHtml(b.brand)}</span>
        <div class="compare-head-ref">${escapeHtml(b.ref)}</div>
      </div>
    </div>`;

  const specRows = allSpecKeys.map(k=>{
    const va = (a.specs||{})[k] ?? '—';
    const vb = (b.specs||{})[k] ?? '—';
    return `<tr><td class="spec-label">${escapeHtml(k)}</td><td class="spec-val">${escapeHtml(String(va))}</td><td class="spec-val">${escapeHtml(String(vb))}</td></tr>`;
  }).join('');

  const priceRows = STORES.map(store=>{
    const pa = a.p[store], pb = b.p[store];
    const na = (pa && pa!=='nd') ? pa.now : null;
    const nb = (pb && pb!=='nd') ? pb.now : null;
    const bestA = na!==null && (nb===null || na<=nb);
    const bestB = nb!==null && (na===null || nb<=na);
    return `<tr class="price-row">
      <td class="spec-label">💰 ${store}</td>
      <td class="spec-val ${bestA && na!==null?'best':''}">${na!==null?fmtCOP(na):'—'}</td>
      <td class="spec-val ${bestB && nb!==null?'best':''}">${nb!==null?fmtCOP(nb):'—'}</td>
    </tr>`;
  }).join('');

  app.innerHTML = `
  <div class="topbar">
    <button class="backbtn" id="backToList">‹ Volver al listado</button>
    <div class="eyebrow">Field Force · Competitive Intelligence</div>
    <h1>Comparación de productos</h1>
  </div>
  <div class="section" style="padding-top:20px;">
    <div class="card" style="padding:0;overflow:hidden;">
      <div style="padding:14px 12px 0;">${headHtml}</div>
      <div style="overflow-x:auto;padding:0 6px 10px;">
        <table class="spec-table">
          <thead><tr><th></th><th>Especificación</th><th></th></tr></thead>
          <tbody>${specRows}${priceRows}</tbody>
        </table>
      </div>
    </div>
    <button class="filter-chip" id="backToList2" style="width:100%;text-align:center;padding:13px;">‹ Elegir otros productos</button>
  </div>
  `;
  document.getElementById('backToList').addEventListener('click', ()=>{ view='list'; render(); });
  document.getElementById('backToList2').addEventListener('click', ()=>{ view='list'; render(); });
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
